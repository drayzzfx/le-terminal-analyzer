name: PR de synchro vers le dépôt de déploiement (drayzzfx)

# But : à chaque push sur `main` de pobsteta, proposer les changements à
# drayzzfx SOUS FORME DE PULL REQUEST (jamais de push direct/force sur son main).
# Romain n'a plus qu'à relire et merger. Le main de drayzzfx n'est jamais écrasé.
#
# Pré-requis (une seule fois, côté Romain) : un secret `DRAYZZ_PUSH_TOKEN`
# (PAT fine-grained ciblant drayzzfx/le-terminal-analyzer) avec les permissions :
#   • Contents: Read and write   (pour pousser la branche technique)
#   • Pull requests: Read and write (pour créer la PR)
#   • Workflows: Read and write   (car la branche contient .github/workflows)
# INACTIF tant que ce secret n'est pas configuré (le job sort sans rien faire).

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: sync-drayzz-pr
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false   # on utilise le PAT, pas le token github-actions

      - name: Pousser une branche technique + ouvrir/mettre à jour la PR
        env:
          GH_TOKEN: ${{ secrets.DRAYZZ_PUSH_TOKEN }}
          REPO: ${{ vars.DRAYZZ_REPO }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "DRAYZZ_PUSH_TOKEN absent — synchro PR désactivée."
            echo "Ajoute le secret (avec droits Contents+Pull requests+Workflows) pour activer."
            exit 0
          fi
          REPO="${REPO:-drayzzfx/le-terminal-analyzer}"
          echo "Mise à jour de la branche sync-pobsteta sur ${REPO} ..."
          # Force UNIQUEMENT sur la branche technique (jamais sur main) → non destructif pour drayzz.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:sync-pobsteta
          echo "Ouverture de la PR (ou mise à jour si elle existe déjà) ..."
          PR_BODY=$'Pull request automatique : changements poussés sur pobsteta/main, à relire et merger. La fusion ajoute le contenu sans supprimer les fichiers propres à drayzzfx.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)'
          gh pr create --repo "$REPO" --base main --head sync-pobsteta \
            --title "Synchro depuis pobsteta/main" \
            --body "$PR_BODY" \
            || echo "PR déjà ouverte — elle a été mise à jour par le push de la branche."
