<!-- @dsCard group="Components" viewport="700x300" name="Buttons & Badges" subtitle="Action buttons, ghost/secondary, market badges" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-base); font-family: var(--font-text); padding: 28px; }
  .grid { display: flex; flex-direction: column; gap: 22px; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .cap { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); letter-spacing: .06em; text-transform: uppercase; width: 100%; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Button, Badge } = window.LeTerminalDesignSystem_028ecb;
    const Arrow = () => (
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    );
    function Demo() {
      return (
        <div className="grid">
          <div className="row">
            <span className="cap">Buttons</span>
            <Button variant="primary" iconRight={<Arrow/>}>Ouvrir le terminal</Button>
            <Button variant="secondary">Voir les signaux</Button>
            <Button variant="ghost">Annuler</Button>
            <Button variant="primary" disabled>Indisponible</Button>
          </div>
          <div className="row">
            <span className="cap">Sizes</span>
            <Button variant="secondary" size="sm">Small</Button>
            <Button variant="secondary" size="md">Medium</Button>
            <Button variant="secondary" size="lg">Large</Button>
          </div>
          <div className="row">
            <span className="cap">Badges</span>
            <Badge tone="bull" dot>Long</Badge>
            <Badge tone="bear">−8.1%</Badge>
            <Badge tone="neutral">Pending</Badge>
            <Badge tone="accent" dot>Live</Badge>
            <Badge tone="mute">FX</Badge>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>
