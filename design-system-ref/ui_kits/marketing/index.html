  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel">
    const { Button, Badge } = window.LeTerminalDesignSystem_028ecb;
    window.Button = Button; window.Badge = Badge;
  </script>
  <script type="text/babel" src="Intro.jsx"></script>
  <script type="text/babel" src="../shared/Chrome.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Tools.jsx"></script>
  <script type="text/babel" src="Showcase.jsx"></script>

  <script type="text/babel" src="Method.jsx"></script>
  <script type="text/babel" src="Pricing.jsx"></script>
  <script type="text/babel">
    function Page() {
      React.useEffect(() => {
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) e.target.classList.add('is-in'); });
        }, { threshold: 0.12 });
        document.querySelectorAll('[data-reveal]').forEach((el) => io.observe(el));

        // Scroll dynamics: progress hairline + hero parallax fade-out
        const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let raf = 0;
        const onScroll = () => {
          if (raf) return;
          raf = requestAnimationFrame(() => {
            raf = 0;
            const h = document.documentElement;
            const fill = document.querySelector('.lt-progress__fill');
            if (fill) fill.style.width = ((h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight)) * 100).toFixed(2) + '%';
            if (!reduced) {
              const inner = document.querySelector('.lt-hero__inner');
              if (inner) {
                const y = Math.min(h.scrollTop, 800);
                inner.style.transform = 'translateY(' + (y * 0.3).toFixed(1) + 'px)';
                inner.style.opacity = String(Math.max(0.05, 1 - y / 650).toFixed(3));
              }
            }
          });
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => { io.disconnect(); window.removeEventListener('scroll', onScroll); if (raf) cancelAnimationFrame(raf); };
      }, []);
      return (
        <React.Fragment>
          <IntroSequence />
          <div className="lt-progress" aria-hidden="true"><span className="lt-progress__fill" /></div>
          <GlobalHeader />
          <SideDock active="home" />
          <Hero />
          <LiveTicker />
          <ToolsSection />
          <StatsSection />
          <ShowcaseSection />
          <VerdictBand />
          <StrategiesSection />
          <MethodSection />
          <PricingBand />
          <CommunityBand />
          <Footer />
        </React.Fragment>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
  </script>
</body>
</html>
