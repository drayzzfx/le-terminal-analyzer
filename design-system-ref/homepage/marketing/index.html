  <script type="text/babel">
    function Page() {
      React.useEffect(() => {
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) e.target.classList.add('is-in'); });
        }, { threshold: 0.12 });
        document.querySelectorAll('[data-reveal],[data-stagger]').forEach((el) => io.observe(el));

        // Scroll dynamics: progress hairline + hero parallax + generic [data-parallax]
        const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const plx = [...document.querySelectorAll('[data-parallax]')].map((el) => ({ el, s: parseFloat(el.getAttribute('data-parallax')) || 0.15 }));
        let raf = 0;
        const onScroll = () => {
          if (raf) return;
          raf = requestAnimationFrame(() => {
            raf = 0;
            const h = document.documentElement;
            const fill = document.querySelector('.lt-progress__fill');
            if (fill) fill.style.width = ((h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight)) * 100).toFixed(2) + '%';
            if (reduced) return;
            const inner = document.querySelector('.lt-hero__inner');
            if (inner) {
              const y = Math.min(h.scrollTop, 800);
              inner.style.transform = 'translateY(' + (y * 0.3).toFixed(1) + 'px)';
              inner.style.opacity = String(Math.max(0.05, 1 - y / 650).toFixed(3));
            }
            const vh = h.clientHeight;
            for (const p of plx) {
              const r = p.el.getBoundingClientRect();
              const mid = r.top + r.height / 2 - vh / 2;
              p.el.style.transform = 'translate3d(0,' + (-mid * p.s).toFixed(1) + 'px,0)';
            }
          });
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
        return () => { io.disconnect(); window.removeEventListener('scroll', onScroll); if (raf) cancelAnimationFrame(raf); };
      }, []);
      return (
        <React.Fragment>
          <IntroSequence />
          <div className="lt-progress" aria-hidden="true"><span className="lt-progress__fill" /></div>
          <GlobalHeader />
          <SideDock active="home" />
          <Hero />
          <ToolsSection />
          <LiveCockpit />
          <StatsSection />
          <MarketsSection />
          <LevelUpsSection />
          <ShowcaseSection />
          <ScreensSection />
          <VerdictBand />
          <StrategiesSection />
          <MethodSection />
          <PricingBand />
          <CommunityBand />
          <Footer />
        </React.Fragment>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
  </script>
