<!-- @dsCard group="Colors" viewport="700x180" name="Text & Borders" subtitle="Text emphasis ramp and divider weights" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-base); font-family: var(--font-text); padding: 20px; display: flex; gap: 28px; align-items: stretch; }
  .col { flex: 1; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .line { display: flex; align-items: baseline; justify-content: space-between; }
  .t { font-size: 16px; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .div { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
  .bdesc { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
</style>
</head>
<body>
  <div class="col">
    <div class="stack">
      <div class="line"><span class="t" style="color:#F2F4F7">Title — high emphasis</span><span class="hex">#F2F4F7</span></div>
      <div class="line"><span class="t" style="color:#C3CAD4">Body — default copy</span><span class="hex">#C3CAD4</span></div>
      <div class="line"><span class="t" style="color:#7E8794">Muted — captions, labels</span><span class="hex">#7E8794</span></div>
    </div>
  </div>
  <div class="col div">
    <div><div class="bdesc">border · #3A414C</div><div style="height:1px;background:#3A414C"></div></div>
    <div><div class="bdesc">border-subtle · #1C212A</div><div style="height:1px;background:#1C212A"></div></div>
  </div>
</body>
</html>
