<!-- @dsCard group="Type" viewport="700x220" name="Text — Inter" subtitle="Headings and body copy scale" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-base); font-family: var(--font-text); padding: 22px 28px; color: var(--text-body); }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: var(--ls-caps); color: var(--accent); }
  h2 { font-size: var(--fs-h2); color: var(--text-title); margin: 0; font-weight: 700; letter-spacing: var(--ls-tight); }
  h3 { font-size: var(--fs-h3); color: var(--text-title); margin: 0; font-weight: 600; }
  p { font-size: var(--fs-base); line-height: var(--lh-base); margin: 0; max-width: 56ch; }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="stack">
    <span class="eyebrow">Salle des marchés privée</span>
    <h2>Précision froide, exécution à minuit</h2>
    <p>Le Terminal réunit vos outils de trading dans un seul cockpit propulsé par l'IA. Signaux, exécution et veille — sans bruit.</p>
    <span class="tag">eyebrow 12/caps · h2 Inter 700 · body Inter 400 · 1.6 lh</span>
  </div>
</body>
</html>
