<!-- @dsCard group="Colors" viewport="700x150" name="Glacial Accent" subtitle="Cold blue — used sparingly for CTAs, links, glows" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-base); font-family: var(--font-text); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border-subtle); padding: 16px; }
  .sw { aspect-ratio: 3/2; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; }
  .name { font-family: var(--font-mono); font-size: 12px; color: #04060B; font-weight: 700; letter-spacing: .02em; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: rgba(4, 6, 11,.7); margin-top: 2px; }
  .glow { box-shadow: 0 0 24px var(--accent-glow); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw glow" style="background:#3B7DFF"><span class="name">accent</span><span class="hex">#3B7DFF</span></div>
    <div class="sw" style="background:#1E5BE0"><span class="name">deep</span><span class="hex">#1E5BE0</span></div>
    <div class="sw" style="background:#8FBAFF"><span class="name">bright</span><span class="hex">#8FBAFF</span></div>
    <div class="sw" style="background:rgba(59, 125, 255,0.35)"><span class="name" style="color:#F2F4F7">glow</span><span class="hex" style="color:#C3CAD4">rgba .35</span></div>
  </div>
</body>
</html>
