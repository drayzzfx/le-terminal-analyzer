<!-- @dsCard group="Type" viewport="700x180" name="Numerals — JetBrains Mono" subtitle="Tabular figures for prices, deltas, tickers" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-base); font-family: var(--font-text); padding: 22px 28px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .cell { border: 1px solid var(--border-subtle); border-radius: 6px; padding: 14px 16px; background: var(--bg-elevated); }
  .tk { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); letter-spacing: .04em; }
  .px { font-family: var(--font-mono); font-size: 26px; font-weight: 500; color: var(--text-title); font-variant-numeric: tabular-nums; margin-top: 4px; }
  .dl { font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 2px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><div class="tk">BTC/USD</div><div class="px">68 412.50</div><div class="dl" style="color:#4ADE9C">▲ +2.18%</div></div>
    <div class="cell"><div class="tk">EUR/USD</div><div class="px">1.0847</div><div class="dl" style="color:#F0647A">▼ −0.42%</div></div>
    <div class="cell"><div class="tk">AAPL</div><div class="px">214.09</div><div class="dl" style="color:#E8C268">— 0.00%</div></div>
  </div>
</body>
</html>
