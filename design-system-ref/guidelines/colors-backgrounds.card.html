<!-- @dsCard group="Colors" viewport="700x150" name="Backgrounds" subtitle="Four-step dark surface ramp, void → elevated" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-base); font-family: var(--font-text); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border-subtle); padding: 16px; }
  .sw { aspect-ratio: 3/2; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; border: 1px solid var(--border-subtle); }
  .name { font-family: var(--font-mono); font-size: 12px; color: var(--text-title); letter-spacing: .02em; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:#04060B"><span class="name">void</span><span class="hex">#04060B</span></div>
    <div class="sw" style="background:#070A11"><span class="name">base</span><span class="hex">#070A11</span></div>
    <div class="sw" style="background:#0B1018"><span class="name">surface</span><span class="hex">#0B1018</span></div>
    <div class="sw" style="background:#101724"><span class="name">elevated</span><span class="hex">#101724</span></div>
  </div>
</body>
</html>
