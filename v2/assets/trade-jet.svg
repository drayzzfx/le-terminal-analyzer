<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f15"/>
      <stop offset="0.55" stop-color="#080b10"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="6%" r="70%">
      <stop offset="0" stop-color="rgba(127,184,232,0.16)"/>
      <stop offset="55%" stop-color="rgba(127,184,232,0.03)"/>
      <stop offset="100%" stop-color="rgba(127,184,232,0)"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b222d"/>
      <stop offset="0.5" stop-color="#0e131b"/>
      <stop offset="1" stop-color="#070a0e"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgba(127,184,232,0.0)"/>
      <stop offset="0.5" stop-color="rgba(191,220,245,0.55)"/>
      <stop offset="1" stop-color="rgba(127,184,232,0.0)"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(127,184,232,0.10)"/>
      <stop offset="1" stop-color="rgba(127,184,232,0)"/>
    </linearGradient>
    <radialGradient id="stairglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="rgba(232,194,104,0.45)"/>
      <stop offset="100%" stop-color="rgba(232,194,104,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1000" fill="url(#bg)"/>
  <rect width="1200" height="1000" fill="url(#spot)"/>

  <!-- sol + réflexion -->
  <rect x="0" y="700" width="1200" height="300" fill="url(#floor)" opacity="0.5"/>
  <line x1="0" y1="702" x2="1200" y2="702" stroke="rgba(127,184,232,0.18)" stroke-width="1.5"/>

  <!-- aile arrière (profondeur) -->
  <path d="M250 560 L520 470 L600 478 L470 600 Z" fill="#0a0e14" opacity="0.85"/>

  <!-- fuselage -->
  <g>
    <path d="M150 540
             C 360 470, 720 452, 980 470
             C 1080 478, 1130 500, 1150 540
             C 1110 556, 1050 566, 980 568
             C 700 582, 360 580, 200 566
             C 168 562, 150 552, 150 540 Z"
          fill="url(#body)" stroke="#2a3340" stroke-width="2"/>
    <!-- liseré lumineux haut -->
    <path d="M170 538 C 380 474, 720 458, 980 474 C 1060 481, 1110 498, 1140 532"
          fill="none" stroke="url(#rim)" stroke-width="2.4"/>
    <!-- cockpit -->
    <path d="M168 540 C 200 520, 235 512, 268 512 L 262 536 C 230 537, 198 542, 176 548 Z" fill="#0c1219"/>
    <path d="M176 533 C 205 520, 235 515, 262 515" fill="none" stroke="rgba(127,184,232,0.5)" stroke-width="2"/>
    <!-- hublots -->
    <g fill="#11202c">
      <rect x="430" y="500" width="22" height="11" rx="4"/>
      <rect x="470" y="498" width="22" height="11" rx="4"/>
      <rect x="510" y="497" width="22" height="11" rx="4"/>
      <rect x="550" y="496" width="22" height="11" rx="4"/>
      <rect x="590" y="496" width="22" height="11" rx="4"/>
      <rect x="630" y="496" width="22" height="11" rx="4"/>
      <rect x="670" y="497" width="22" height="11" rx="4"/>
      <rect x="710" y="498" width="22" height="11" rx="4"/>
      <rect x="750" y="500" width="22" height="11" rx="4"/>
    </g>
    <g fill="rgba(127,184,232,0.35)">
      <rect x="432" y="502" width="18" height="7" rx="3"/>
      <rect x="512" y="499" width="18" height="7" rx="3"/>
      <rect x="592" y="498" width="18" height="7" rx="3"/>
      <rect x="672" y="499" width="18" height="7" rx="3"/>
      <rect x="752" y="502" width="18" height="7" rx="3"/>
    </g>
  </g>

  <!-- dérive (queue) -->
  <path d="M980 470 C 1010 400, 1040 360, 1085 345 C 1095 410, 1075 460, 1040 478 Z"
        fill="url(#body)" stroke="#2a3340" stroke-width="2"/>
  <path d="M992 462 C 1018 405, 1045 372, 1082 352" fill="none" stroke="rgba(191,220,245,0.4)" stroke-width="2"/>

  <!-- réacteur -->
  <ellipse cx="930" cy="560" rx="56" ry="30" fill="#0a0e14" stroke="#2a3340" stroke-width="2"/>
  <ellipse cx="930" cy="560" rx="30" ry="17" fill="#05070a" stroke="rgba(127,184,232,0.25)" stroke-width="1.5"/>

  <!-- escalier (lueur dorée, esprit maquette) -->
  <ellipse cx="360" cy="690" rx="150" ry="60" fill="url(#stairglow)"/>
  <g stroke="rgba(232,194,104,0.8)" stroke-width="3" stroke-linecap="round">
    <line x1="300" y1="566" x2="430" y2="690"/>
    <line x1="324" y1="566" x2="454" y2="690"/>
  </g>
  <g stroke="rgba(232,194,104,0.55)" stroke-width="4" stroke-linecap="round">
    <line x1="316" y1="586" x2="334" y2="586"/>
    <line x1="330" y1="606" x2="352" y2="606"/>
    <line x1="346" y1="628" x2="372" y2="628"/>
    <line x1="362" y1="650" x2="392" y2="650"/>
    <line x1="380" y1="672" x2="414" y2="672"/>
  </g>
  <!-- porte ouverte -->
  <path d="M300 520 L300 566 L332 566 L332 524 Z" fill="#0c1219" stroke="rgba(232,194,104,0.4)" stroke-width="1.5"/>

  <!-- train d'atterrissage -->
  <g stroke="#1b222d" stroke-width="6" stroke-linecap="round">
    <line x1="520" y1="578" x2="520" y2="690"/>
    <line x1="900" y1="572" x2="900" y2="688"/>
  </g>
  <ellipse cx="520" cy="694" rx="22" ry="9" fill="#0a0e14"/>
  <ellipse cx="900" cy="692" rx="22" ry="9" fill="#0a0e14"/>

  <!-- réflexion fuselage au sol -->
  <path d="M200 712 C 500 728, 800 728, 1050 716 C 800 760, 500 760, 220 740 Z" fill="rgba(127,184,232,0.06)"/>
</svg>
