<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LE TERMINAL — Bubble Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://s3.tradingview.com" crossorigin>
<link rel="dns-prefetch" href="https://s3.tradingview.com">
<link rel="preconnect" href="https://www.tradingview-widget.com" crossorigin>
<link rel="dns-prefetch" href="https://www.tradingview-widget.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080F;--border:rgba(255,255,255,0.08);--v:#0095FF;--v2:#38B6FF;--text:#F0EEFF;--text2:#9B96B8;--text3:#5A5570;--green:#34D399}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;-webkit-font-smoothing:antialiased}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:56px;background:rgba(8,8,15,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0}
.brand{font-family:'Bricolage Grotesque',sans-serif;font-size:16px;font-weight:800}
.brand span{color:var(--v2)}
.hbtn{display:flex;flex-direction:column;gap:5px;background:transparent;border:none;cursor:pointer;padding:6px;border-radius:8px}
.hbtn span{display:block;width:20px;height:2px;background:var(--text2);border-radius:2px}
.eco-tabs{display:flex;align-items:center;gap:2px;padding:0 18px;background:rgba(8,8,15,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.eco-tabs::-webkit-scrollbar{display:none}
.eco-tab{padding:10px 16px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text3);font-family:'Bricolage Grotesque',sans-serif;font-size:13px;font-weight:700;letter-spacing:.02em;cursor:pointer;transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.eco-tab:hover{color:var(--text2)}
.eco-tab.on{color:var(--v2);border-bottom-color:var(--v2)}
.sz-group{display:flex;align-items:center;gap:2px;margin-left:auto;flex-shrink:0}
.sz-btn{padding:4px 10px;background:transparent;border:1px solid transparent;border-radius:50px;color:var(--text3);font-family:'Bricolage Grotesque',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .18s;white-space:nowrap}
.sz-btn:hover{color:var(--text2)}
.sz-btn.on{background:rgba(0,149,255,.15);border-color:rgba(0,149,255,.3);color:var(--v2)}
.live{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--green);flex-shrink:0;padding:0 4px}
.ld{width:6px;height:6px;border-radius:50%;background:var(--green);animation:p 2s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}

/* MAP takes ALL remaining space */
.map{flex:1;min-height:0;position:relative;background:#131722}
.map .tradingview-widget-container{position:absolute;top:0;left:0;right:0;bottom:0}
.map .tradingview-widget-container__widget{width:100%;height:100%}

/* SKELETON LOADER */
.map-loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#131722;z-index:10;transition:opacity .4s}
.map-loader.hidden{opacity:0;pointer-events:none}
.map-loader-bar{width:120px;height:3px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.map-loader-bar::after{content:'';display:block;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(0,149,255,.6),transparent);animation:shimmer 1.2s infinite}
@keyframes shimmer{from{transform:translateX(-200%)}to{transform:translateX(400%)}}

.foot{display:flex;align-items:center;gap:10px;padding:5px 16px;background:rgba(8,8,15,.9);border-top:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text3)}
.ldc{width:8px;height:8px;border-radius:50%}
.src{font-size:10px;color:var(--text3);margin-left:auto}
.src a{color:var(--v2);text-decoration:none}
</style>
</head>
<body>

<header class="topbar">
  <div style="display:flex;align-items:center;gap:10px">
    <button class="hbtn" onclick="ltOpenMenu()"><span></span><span></span><span></span></button>
    <a href="./index.html" class="brand" style="text-decoration:none;color:inherit"><img src="./logo.jpg.webp" alt="logo" style="width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid rgba(56,182,255,.3);margin-right:8px;vertical-align:middle">Le Terminal <span>Bubble Map</span></a>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="live"><div class="ld"></div>LIVE</div>
    <div id="ltUserBar"></div>
  </div>
</header>

<nav class="eco-tabs">
  <button class="eco-tab on" onclick="setMkt('crypto',this)">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="9"/><path d="M9.5 7.5h4.2a2.4 2.4 0 0 1 0 4.8H9.5m0 0h4.6a2.4 2.4 0 0 1 0 4.7H9.5m0-9.5V17m1.8-9.5V6m0 12.5V17m2.4-9.5V6m0 12.5V17"/></svg>
    Crypto
  </button>
  <button class="eco-tab" onclick="setMkt('forex',this)">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M2 12h20M12 2c2.5 2.5 2.5 15 0 18M12 2c-2.5 2.5-2.5 15 0 18"/></svg>
    Forex
  </button>
  <button class="eco-tab" onclick="setMkt('stocks',this)">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Actions US
  </button>
  <button class="eco-tab" onclick="setMkt('etf',this)">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
    ETF
  </button>
  <div class="sz-group" id="szG">
    <button class="sz-btn on" onclick="setSz('market_cap_calc',this)">Cap.</button>
    <button class="sz-btn" onclick="setSz('volume',this)">Volume</button>
  </div>
  <div class="live"><div class="ld"></div>TradingView</div>
</nav>

<div class="map" id="mapWrap">
  <div class="map-loader" id="mapLoader">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="rgba(0,149,255,.5)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="7" r="2"/><circle cx="19" cy="7" r="2.5"/><circle cx="6" cy="17" r="1.5"/><circle cx="18" cy="16" r="2"/></svg>
    <div class="map-loader-bar"></div>
  </div>
</div>

<div class="foot">
  <div class="leg"><div class="ldc" style="background:#1a9e6e"></div>Forte hausse</div>
  <div class="leg"><div class="ldc" style="background:#4caf80"></div>Hausse</div>
  <div class="leg"><div class="ldc" style="background:#888"></div>Neutre</div>
  <div class="leg"><div class="ldc" style="background:#ef5350"></div>Baisse</div>
  <div class="leg"><div class="ldc" style="background:#c62828"></div>Forte baisse</div>
  <div class="src">Données via <a href="https://www.tradingview.com" target="_blank">TradingView</a></div>
</div>

<script>
var mkt = 'crypto', sz = 'market_cap_calc';
var loaderTimer = null;

function showLoader() {
  var l = document.getElementById('mapLoader');
  if (l) { l.classList.remove('hidden'); }
  // Masquer automatiquement après 4s max (TradingView ne notifie pas la fin)
  if (loaderTimer) clearTimeout(loaderTimer);
  loaderTimer = setTimeout(function() {
    var l = document.getElementById('mapLoader');
    if (l) l.classList.add('hidden');
  }, 2000);
}

function setMkt(v, btn) {
  mkt = v;
  document.querySelectorAll('.eco-tab').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  var isCrypto = v === 'crypto';
  document.getElementById('szG').style.visibility = isCrypto ? 'visible' : 'hidden';
  render();
}

function setSz(v, btn) {
  sz = v;
  document.querySelectorAll('#szG .sz-btn').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  render();
}

function render() {
  var wrap = document.getElementById('mapWrap');
  var loader = document.getElementById('mapLoader');

  // Retirer l'ancien widget mais garder le loader
  var old = wrap.querySelector('.tradingview-widget-container');
  if (old) wrap.removeChild(old);

  showLoader();

  var container = document.createElement('div');
  container.className = 'tradingview-widget-container';

  var inner = document.createElement('div');
  inner.className = 'tradingview-widget-container__widget';
  container.appendChild(inner);

  var script = document.createElement('script');
  script.type = 'text/javascript';
  script.async = true;

  var cfg = {
    colorTheme: 'dark',
    locale: 'fr',
    hasTopBar: false,
    isDataSetEnabled: false,
    isZoomEnabled: true,
    hasSymbolTooltip: true,
    width: '100%',
    height: '100%'
  };

  if (mkt === 'crypto') {
    script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-crypto-coins-heatmap.js';
    cfg.dataSource = 'Crypto';
    cfg.blockSize = sz;
    cfg.blockColor = 'change';
    cfg.isMonoSize = false;
  } else if (mkt === 'forex') {
    script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-forex-heat-map.js';
    cfg.currencies = ['EUR','USD','JPY','GBP','CHF','AUD','CAD','NZD'];
  } else if (mkt === 'stocks') {
    script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js';
    cfg.exchanges = [];
    cfg.dataSource = 'SPX500';
    cfg.grouping = 'sector';
    cfg.blockSize = 'market_cap_basic';
    cfg.blockColor = 'change';
  } else if (mkt === 'etf') {
    script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-etf-heatmap.js';
    cfg.dataSource = 'AllUSEtf';
    cfg.grouping = 'asset_class';
    cfg.blockSize = 'aum';
    cfg.blockColor = 'change';
  }

  script.textContent = JSON.stringify(cfg);
  container.appendChild(script);
  wrap.appendChild(container);
}

render();
</script>

<script src="./menu.js"></script>
</body>
</html>
