<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LE TERMINAL — Bubble Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080F;--border:rgba(255,255,255,0.08);--v:#8B5CF6;--v2:#A78BFA;--text:#F0EEFF;--text2:#9B96B8;--text3:#5A5570;--green:#34D399}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;-webkit-font-smoothing:antialiased}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:56px;background:rgba(8,8,15,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0}
.brand{font-family:'Bricolage Grotesque',sans-serif;font-size:16px;font-weight:800}
.brand span{color:var(--v2)}
.hbtn{display:flex;flex-direction:column;gap:5px;background:transparent;border:none;cursor:pointer;padding:6px;border-radius:8px}
.hbtn span{display:block;width:20px;height:2px;background:var(--text2);border-radius:2px}
.controls{display:flex;align-items:center;gap:6px;padding:8px 16px;background:rgba(8,8,15,.9);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.controls::-webkit-scrollbar{display:none}
.cg{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:50px;padding:3px;flex-shrink:0}
.cb{padding:4px 12px;background:transparent;border:none;border-radius:50px;color:var(--text3);font-family:'Bricolage Grotesque',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .18s;white-space:nowrap}
.cb:hover{color:var(--text2)}
.cb.on{background:var(--v);color:white}
.sep{width:1px;height:18px;background:var(--border);flex-shrink:0;margin:0 4px}
.live{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--green);margin-left:auto;flex-shrink:0}
.ld{width:6px;height:6px;border-radius:50%;background:var(--green);animation:p 2s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.map{flex:1;position:relative;min-height:0;background:#131722}
.map .tradingview-widget-container{position:absolute;inset:0;width:100%;height:100%}
.map .tradingview-widget-container__widget{width:100%;height:100%}
.foot{display:flex;align-items:center;gap:10px;padding:5px 16px;background:rgba(8,8,15,.9);border-top:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text3)}
.ldc{width:8px;height:8px;border-radius:50%}
.src{font-size:10px;color:var(--text3);margin-left:auto}
.src a{color:var(--v2);text-decoration:none}
</style>
</head>
<body>

<header class="topbar">
  <div style="display:flex;align-items:center;gap:10px">
    <button class="hbtn" onclick="ltOpenMenu()"><span></span><span></span><span></span></button>
    <div class="brand">Le Terminal <span>Bubble Map</span></div>
  </div>
  <div class="live"><div class="ld"></div>LIVE</div>
</header>

<div class="controls">
  <div class="cg" id="mktG">
    <button class="cb on" onclick="setMkt('crypto',this)">🪙 Crypto</button>
    <button class="cb" onclick="setMkt('forex',this)">💱 Forex</button>
    <button class="cb" onclick="setMkt('stocks',this)">📈 Actions US</button>
    <button class="cb" onclick="setMkt('etf',this)">📦 ETF</button>
  </div>
  <div class="sep" id="tfSep"></div>
  <div class="cg" id="tfG">
    <button class="cb" onclick="setTf('60',this)">1H</button>
    <button class="cb on" onclick="setTf('D',this)">24H</button>
    <button class="cb" onclick="setTf('W',this)">7J</button>
    <button class="cb" onclick="setTf('M',this)">1M</button>
  </div>
  <div class="sep" id="szSep"></div>
  <div class="cg" id="szG">
    <button class="cb on" onclick="setSz('market_cap_calc',this)">Cap.</button>
    <button class="cb" onclick="setSz('volume',this)">Volume</button>
  </div>
  <div class="live"><div class="ld"></div>TradingView</div>
</div>

<div class="map" id="mapWrap"></div>

<div class="foot">
  <div class="leg"><div class="ldc" style="background:#1a9e6e"></div>Forte hausse</div>
  <div class="leg"><div class="ldc" style="background:#4caf80"></div>Hausse</div>
  <div class="leg"><div class="ldc" style="background:#888"></div>Neutre</div>
  <div class="leg"><div class="ldc" style="background:#ef5350"></div>Baisse</div>
  <div class="leg"><div class="ldc" style="background:#c62828"></div>Forte baisse</div>
  <div class="src">Données via <a href="https://www.tradingview.com" target="_blank">TradingView</a></div>
</div>

<script>
var mkt = 'crypto', tf = 'D', sz = 'market_cap_calc';

function setMkt(v, btn) {
  mkt = v;
  document.querySelectorAll('#mktG .cb').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  // Hide tf + sz for forex
  var show = v !== 'forex';
  document.getElementById('tfSep').style.display = show ? '' : 'none';
  document.getElementById('tfG').style.display = show ? '' : 'none';
  document.getElementById('szSep').style.display = (v === 'crypto') ? '' : 'none';
  document.getElementById('szG').style.display = (v === 'crypto') ? '' : 'none';
  render();
}

function setTf(v, btn) {
  tf = v;
  document.querySelectorAll('#tfG .cb').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  render();
}

function setSz(v, btn) {
  sz = v;
  document.querySelectorAll('#szG .cb').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  render();
}

function render() {
  var wrap = document.getElementById('mapWrap');

  // Build config
  var cfg = {
    colorTheme: 'dark',
    locale: 'fr',
    hasTopBar: false,
    isDataSetEnabled: false,
    isZoomEnabled: true,
    hasSymbolTooltip: true,
    width: '100%',
    height: '100%'
  };

  var widgetName;

  if (mkt === 'crypto') {
    widgetName = 'crypto-coins-heatmap';
    cfg.dataSource = 'Crypto';
    cfg.blockSize = sz;
    cfg.blockColor = 'change';
    cfg.isMonoSize = false;
  } else if (mkt === 'forex') {
    widgetName = 'forex-heat-map';
    cfg.currencies = ['EUR','USD','JPY','GBP','CHF','AUD','CAD','NZD'];
  } else if (mkt === 'stocks') {
    widgetName = 'stock-heatmap';
    cfg.exchanges = [];
    cfg.dataSource = 'SPX500';
    cfg.grouping = 'sector';
    cfg.blockSize = 'market_cap_basic';
    cfg.blockColor = 'change';
  } else if (mkt === 'etf') {
    widgetName = 'etf-heatmap';
    cfg.dataSource = 'AllUSEtf';
    cfg.grouping = 'asset_class';
    cfg.blockSize = 'aum';
    cfg.blockColor = 'change';
  }

  // Use iframe with encoded config — bypasses script caching issue
  // TradingView embed page supports config via postMessage or URL
  var cfgStr = encodeURIComponent(JSON.stringify(cfg));
  var iframeSrc = 'https://www.tradingview-widget.com/embed-widget/' + widgetName +
    '/?locale=fr&colorTheme=dark#' + cfgStr;

  // Actually use the proper TV script approach but force reload by recreating DOM
  wrap.innerHTML = '';

  var html = '<div class="tradingview-widget-container" style="width:100%;height:100%">' +
    '<div class="tradingview-widget-container__widget" style="width:100%;height:100%"></div>' +
    '<script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-' +
    widgetName + '.js" async>' +
    JSON.stringify(cfg) +
    '<\/script>' +
    '</div>';

  // Use iframe trick to force fresh script execution
  var blob = new Blob([
    '<!DOCTYPE html><html><head><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#131722}</style></head><body>' +
    html + '</body></html>'
  ], {type: 'text/html'});

  var iframe = document.createElement('iframe');
  iframe.style.width = '100%';
  iframe.style.height = '100%';
  iframe.style.border = 'none';
  iframe.src = URL.createObjectURL(blob);
  wrap.appendChild(iframe);
}

render();
</script>

<script src="./menu.js"></script>
</body>
</html>
