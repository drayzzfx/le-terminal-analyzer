<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LE TERMINAL — Bubble Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08080F;
  --card: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.08);
  --v: #8B5CF6;
  --v2: #A78BFA;
  --text: #F0EEFF;
  --text2: #9B96B8;
  --text3: #5A5570;
  --green: #34D399;
  --red: #F87171;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;-webkit-font-smoothing:antialiased}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:56px;background:rgba(8,8,15,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar-brand{font-family:'Bricolage Grotesque',sans-serif;font-size:16px;font-weight:800}
.topbar-brand span{color:var(--v2)}
.hbtn{display:flex;flex-direction:column;gap:5px;background:transparent;border:none;cursor:pointer;padding:6px;border-radius:8px}
.hbtn span{display:block;width:20px;height:2px;background:var(--text2);border-radius:2px}

.controls{display:flex;align-items:center;gap:6px;padding:8px 16px;background:rgba(8,8,15,.9);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.controls::-webkit-scrollbar{display:none}
.ctrl-group{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:50px;padding:3px;flex-shrink:0}
.ctrl-btn{padding:4px 12px;background:transparent;border:none;border-radius:50px;color:var(--text3);font-family:'Bricolage Grotesque',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .18s;white-space:nowrap}
.ctrl-btn:hover{color:var(--text2)}
.ctrl-btn.on{background:var(--v);color:white}
.sep{width:1px;height:18px;background:var(--border);flex-shrink:0;margin:0 2px}
.live{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--green);margin-left:auto;flex-shrink:0}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:p 2s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}

.map-wrap{flex:1;position:relative;min-height:0;background:#131722}
.map-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none}

.foot{display:flex;align-items:center;gap:12px;padding:6px 16px;background:rgba(8,8,15,.9);border-top:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text3)}
.ld{width:8px;height:8px;border-radius:50%}
.src{font-size:10px;color:var(--text3);margin-left:auto}
.src a{color:var(--v2);text-decoration:none}
</style>
</head>
<body>

<header class="topbar">
  <div style="display:flex;align-items:center;gap:10px">
    <button class="hbtn" onclick="ltOpenMenu()"><span></span><span></span><span></span></button>
    <div class="topbar-brand">Le Terminal <span>Bubble Map</span></div>
  </div>
  <div class="live"><div class="live-dot"></div>LIVE</div>
</header>

<div class="controls">
  <!-- Marché -->
  <div class="ctrl-group" id="mktGroup">
    <button class="ctrl-btn on" onclick="pick('mkt','crypto',this)">🪙 Crypto</button>
    <button class="ctrl-btn" onclick="pick('mkt','forex',this)">💱 Forex</button>
    <button class="ctrl-btn" onclick="pick('mkt','stocks',this)">📈 Indices US</button>
    <button class="ctrl-btn" onclick="pick('mkt','etf',this)">📦 ETF</button>
  </div>

  <div class="sep"></div>

  <!-- Période -->
  <div class="ctrl-group" id="tfGroup">
    <button class="ctrl-btn" onclick="pick('tf','60',this)">1H</button>
    <button class="ctrl-btn on" onclick="pick('tf','D',this)">24H</button>
    <button class="ctrl-btn" onclick="pick('tf','W',this)">7J</button>
    <button class="ctrl-btn" onclick="pick('tf','M',this)">1M</button>
  </div>

  <div class="sep"></div>

  <!-- Taille bulle -->
  <div class="ctrl-group" id="sizeGroup">
    <button class="ctrl-btn on" onclick="pick('size','market_cap_calc',this)">Cap.</button>
    <button class="ctrl-btn" onclick="pick('size','volume',this)">Volume</button>
  </div>

  <div class="live"><div class="live-dot"></div>TradingView</div>
</div>

<div class="map-wrap" id="mapWrap"></div>

<div class="foot">
  <div class="leg"><div class="ld" style="background:#1a9e6e"></div>Forte hausse</div>
  <div class="leg"><div class="ld" style="background:#4caf80"></div>Hausse</div>
  <div class="leg"><div class="ld" style="background:#888"></div>Neutre</div>
  <div class="leg"><div class="ld" style="background:#ef5350"></div>Baisse</div>
  <div class="leg"><div class="ld" style="background:#c62828"></div>Forte baisse</div>
  <div class="src">Données via <a href="https://www.tradingview.com" target="_blank">TradingView</a></div>
</div>

<script>
var state = { mkt: 'crypto', tf: 'D', size: 'market_cap_calc' };

function pick(key, val, btn) {
  state[key] = val;
  var group = btn.parentElement;
  group.querySelectorAll('.ctrl-btn').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');

  // Hide size group for forex (not applicable)
  document.getElementById('sizeGroup').style.display =
    (state.mkt === 'forex') ? 'none' : 'flex';

  render();
}

function render() {
  var wrap = document.getElementById('mapWrap');

  // Build config based on market
  var cfg = {
    colorTheme: 'dark',
    locale: 'fr',
    hasTopBar: false,
    isDataSetEnabled: false,
    isZoomEnabled: true,
    hasSymbolTooltip: true,
    isMonoSize: false,
    width: '100%',
    height: '100%',
    blockColor: 'change',
    blockSize: state.size
  };

  var widgetType, src;

  if (state.mkt === 'crypto') {
    widgetType = 'crypto-coins-heatmap';
    cfg.dataSource = 'Crypto';
  } else if (state.mkt === 'forex') {
    // Use forex heatmap — different widget
    widgetType = 'forex-heat-map';
    cfg.currencies = ['EUR','USD','JPY','GBP','CHF','AUD','CAD','NZD'];
  } else if (state.mkt === 'stocks') {
    widgetType = 'stock-heatmap';
    cfg.exchanges = [];
    cfg.dataSource = 'SPX500';
    cfg.grouping = 'sector';
  } else if (state.mkt === 'etf') {
    widgetType = 'etf-heatmap';
    cfg.dataSource = 'AllUSEtf';
    cfg.grouping = 'asset_class';
  }

  // Inject timeframe into config
  cfg.timeframe = state.tf;

  // Build iframe URL
  src = 'https://www.tradingview.com/widgetembed/?widgetType=' + widgetType +
    '&widgetConfig=' + encodeURIComponent(JSON.stringify(cfg)) +
    '&utm_source=terminal&utm_medium=widget';

  wrap.innerHTML = '<iframe src="' + src + '" allowtransparency="true" scrolling="no" frameborder="0"></iframe>';
}

render();
</script>

<script src="./menu.js"></script>
</body>
</html>
