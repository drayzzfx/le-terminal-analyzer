<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Terminal — Analyse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./eco.css">
<style>
/* ── Article page layout ── */
.art-wrap { max-width: 780px; margin: 0 auto; padding: 40px 24px 80px; }

/* Header article */
.art-header { margin-bottom: 36px; }
.art-eyebrow {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text3); margin-bottom: 16px;
}
.art-zone { color: var(--v2); }
.art-title {
  font-family: var(--display); font-size: clamp(22px,4vw,34px);
  font-weight: 800; line-height: 1.15; letter-spacing: -0.02em;
  margin-bottom: 16px; color: var(--text);
}
.art-meta {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  font-size: 12px; color: var(--text3);
}
.art-source-link {
  color: var(--v2); text-decoration: none; font-weight: 500;
  border: 1px solid rgba(0,149,255,0.3); padding: 4px 12px; border-radius: 20px;
  transition: all 0.2s;
}
.art-source-link:hover { background: rgba(0,149,255,0.1); border-color: var(--v); }

/* Chargement */
.art-loading {
  display: flex; flex-direction: column; align-items: center;
  gap: 16px; padding: 80px 24px; color: var(--text3); text-align: center;
}
.art-spinner {
  width: 36px; height: 36px; border: 2px solid var(--border);
  border-top-color: var(--v); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.art-loading-text { font-size: 14px; }
.art-loading-sub { font-size: 12px; color: var(--text3); margin-top: 4px; }

/* Sections */
.art-section {
  border: 1px solid var(--border); border-radius: var(--r);
  overflow: hidden; margin-bottom: 20px;
  animation: rise 0.5s cubic-bezier(.2,.7,.3,1) both;
}
.art-section--beginner { border-color: rgba(52,211,153,0.25); }
.art-section--pro      { border-color: rgba(0,149,255,0.25); }

.art-section__head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 20px; border-bottom: 1px solid var(--border);
  font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
}
.art-section--beginner .art-section__head { background: rgba(52,211,153,0.06); color: var(--green); border-color: rgba(52,211,153,0.15); }
.art-section--pro      .art-section__head { background: rgba(0,149,255,0.06);  color: var(--v2);   border-color: rgba(0,149,255,0.12); }

.art-section__body { padding: 22px 20px; display: flex; flex-direction: column; gap: 20px; }

/* Bloc dans la section */
.art-block__label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text3); margin-bottom: 7px;
}
.art-block__text {
  font-size: 15px; line-height: 1.7; color: var(--text2); font-weight: 300;
}
.art-block__text strong { color: var(--text); font-weight: 600; }

/* Mot clé pill */
.art-keyword {
  display: inline-block; background: rgba(255,255,255,0.05);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 16px; font-size: 13px; line-height: 1.6; color: var(--text2);
}
.art-keyword strong { color: var(--green); }

/* Biais recommandé */
.art-biais {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
}
.art-biais--on  { background: rgba(52,211,153,0.12); color: var(--green); border: 1px solid rgba(52,211,153,0.25); }
.art-biais--off { background: rgba(248,113,113,0.12); color: var(--red);   border: 1px solid rgba(248,113,113,0.25); }
.art-biais--wait{ background: rgba(148,163,184,0.10); color: var(--text2); border: 1px solid var(--border); }

/* Conclusion */
.art-conclusion {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r); padding: 20px 22px;
  font-family: var(--display); font-size: 17px; font-weight: 600;
  line-height: 1.4; color: var(--text); text-align: center;
  margin-bottom: 20px;
}

/* Erreur */
.art-error {
  text-align: center; padding: 60px 24px; color: var(--text3); font-size: 14px;
}
.art-error a { color: var(--v2); }

/* Bouton retour */
.art-back {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--text3); text-decoration: none;
  padding: 8px 0; margin-bottom: 24px; transition: color 0.2s;
}
.art-back:hover { color: var(--text); }

/* Skeleton */
.art-skel { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 24px; margin-bottom: 20px; }
.art-skel-line {
  height: 14px; border-radius: 8px; margin-bottom: 12px;
  background: linear-gradient(90deg, var(--border) 25%, rgba(255,255,255,0.07) 50%, var(--border) 75%);
  background-size: 800px 100%;
  animation: shimmer 1.5s infinite linear;
}
.art-skel-line--title { height: 28px; width: 80%; margin-bottom: 20px; }
.art-skel-line--short { width: 45%; }
.art-skel-line--med   { width: 70%; }
</style>
</head>
<body class="eco-page">
<div class="glow" aria-hidden="true"></div>
<header class="lt-topbar">
  <div style="display:flex;align-items:center;gap:10px">
    <button class="lt-hamburger" onclick="ltOpenMenu()">
      <span></span><span></span><span></span>
    </button>
    <a href="./index.html" class="lt-brand" style="text-decoration:none;color:inherit">
      <img src="./logo.jpg.webp" alt="logo" style="width:30px;height:30px;border-radius:50%;object-fit:cover;border:1px solid rgba(56,182,255,.3);margin-right:8px;vertical-align:middle">
      Le Terminal <span>Éco</span>
    </a>
  </div>
  <div style="display:flex;align-items:center;gap:14px">
    <div class="lt-status"><div class="lt-dot"></div>LIVE</div>
    <button class="langbtn" id="langToggle" type="button" aria-label="Switch language" title="English / Français">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18"/></svg>
      <span class="lang__label">EN</span>
    </button>
  </div>
</header>

<main>
<div class="art-wrap" id="artContent">
  <!-- Skeleton pendant le chargement -->
  <div class="art-skel"><div class="art-skel-line art-skel-line--short"></div><div class="art-skel-line art-skel-line--title"></div><div class="art-skel-line art-skel-line--med"></div></div>
  <div class="art-skel"><div class="art-skel-line art-skel-line--short"></div><div class="art-skel-line"></div><div class="art-skel-line art-skel-line--med"></div><div class="art-skel-line"></div></div>
  <div class="art-skel"><div class="art-skel-line art-skel-line--short"></div><div class="art-skel-line"></div><div class="art-skel-line art-skel-line--med"></div></div>
</div>
</main>

<div class="backdrop" id="navBackdrop" aria-hidden="true"></div>
<script src="./eco.js"></script>
<script src="./menu.js"></script>
<script>
(function(){
  // ── Lit l'ID dans l'URL ──────────────────────────────────────────────────
  var params = new URLSearchParams(window.location.search);
  var id     = params.get('id');
  var wrap   = document.getElementById('artContent');

  var ZONE_NAMES = {
    fr: { europe:'Europe', ameriques:'Amériques', asie:'Asie',
          institutions:'Institutions', marches:'Marchés', crypto:'Crypto' },
    en: { europe:'Europe', ameriques:'Americas', asie:'Asia',
          institutions:'Institutions', marches:'Markets', crypto:'Crypto' }
  };

  function getLang() { return localStorage.getItem('lt_lang') || 'fr'; }

  function sentimentBadge(s) {
    var map = {
      'Positif':{ cls:'bias--up',   fr:'Positif', en:'Positive' },
      'Négatif':{ cls:'bias--down', fr:'Négatif', en:'Negative' },
      'Neutre': { cls:'bias--flat', fr:'Neutre',  en:'Neutral'  },
    };
    var m = map[s] || map['Neutre'];
    var l = getLang();
    return '<span class="bias ' + m.cls + '">' + (l==='en' ? m.en : m.fr) + '</span>';
  }

  function biasBadge(text) {
    if (!text) return '';
    var lo = text.toLowerCase();
    var cls = lo.includes('risk-on')  ? 'art-biais--on'
            : lo.includes('risk-off') ? 'art-biais--off'
            : 'art-biais--wait';
    return '<span class="art-biais ' + cls + '">' + text + '</span>';
  }

  function fmt(iso) {
    try {
      return new Date(iso).toLocaleDateString(getLang()==='en'?'en-GB':'fr-FR',
        {day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
    } catch(e){ return ''; }
  }

  function renderError(msg) {
    wrap.innerHTML = '<div class="art-error">'
      + '<p style="font-size:32px;margin-bottom:16px">📰</p>'
      + '<p>' + msg + '</p>'
      + '<p style="margin-top:16px"><a href="javascript:history.back()" class="art-back">← Retour</a></p>'
      + '</div>';
  }

  function renderArticle(article, analysis) {
    var l = getLang();
    var a = analysis ? (analysis[l] || analysis['fr']) : null;
    var zone = ZONE_NAMES[l][article.zone] || article.zone;

    var html = '<a href="javascript:history.back()" class="art-back">← ' + (l==='en'?'Back':'Retour') + '</a>';

    // ── Header ──
    var analysisTitle = a ? a.titre_analyse : article.title;
    html += '<header class="art-header">'
      + '<div class="art-eyebrow">'
      + '<span class="art-zone">' + zone + '</span>'
      + '<span>·</span>'
      + '<span>' + (article.source||'') + '</span>'
      + '<span>·</span>'
      + '<span>' + fmt(article.published_at) + '</span>'
      + sentimentBadge(article.sentiment)
      + '</div>'
      + '<h1 class="art-title">' + analysisTitle + '</h1>'
      + '<div class="art-meta">'
      + (article.url ? '<a class="art-source-link" href="' + article.url + '" target="_blank" rel="noopener nofollow">'
        + (l==='en'?'Read original source ↗':'Lire la source originale ↗') + '</a>' : '')
      + '</div>'
      + '</header>';

    if (!a) {
      // Pas d'analyse disponible — affiche juste le résumé
      html += '<div class="art-conclusion">' + (article.summary||'Résumé non disponible.') + '</div>';
      wrap.innerHTML = html;
      return;
    }

    var db = a.pour_les_debutants;
    var dp = a.pour_les_professionnels;

    // ── Section débutants ──
    html += '<section class="art-section art-section--beginner">'
      + '<div class="art-section__head">'
      + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2z"/><path d="M12 8v4l3 3"/></svg>'
      + (l==='en' ? 'For beginners — what’s happening' : 'Pour les débutants — ce qui se passe')
      + '</div>'
      + '<div class="art-section__body">'
      + '<div><div class="art-block__label">' + (l==='en'?'What happened':'Ce qui se passe') + '</div>'
      + '<p class="art-block__text">' + db.ce_qui_se_passe + '</p></div>'
      + '<div><div class="art-block__label">' + (l==='en'?'Why it matters':'Pourquoi c\'est important') + '</div>'
      + '<p class="art-block__text">' + db.pourquoi_cest_important + '</p></div>'
      + '<div><div class="art-block__label">' + (l==='en'?'Key term to know':'Le mot clé à retenir') + '</div>'
      + '<div class="art-keyword">' + db.le_mot_cle + '</div></div>'
      + '</div></section>';

    // ── Section professionnels ──
    html += '<section class="art-section art-section--pro">'
      + '<div class="art-section__head">'
      + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>'
      + (l==='en' ? 'For professionals — market analysis' : 'Pour les professionnels — analyse marché')
      + '</div>'
      + '<div class="art-section__body">'
      + '<div><div class="art-block__label">' + (l==='en'?'Macro analysis':'Analyse macro') + '</div>'
      + '<p class="art-block__text">' + dp.analyse_macro + '</p></div>'
      + '<div><div class="art-block__label">' + (l==='en'?'Market impact':'Impact marchés') + '</div>'
      + '<p class="art-block__text">' + dp.impact_marches + '</p></div>'
      + (dp.niveaux_cles && dp.niveaux_cles !== 'N/A' ?
        '<div><div class="art-block__label">' + (l==='en'?'Key levels to watch':'Niveaux clés à surveiller') + '</div>'
        + '<p class="art-block__text">' + dp.niveaux_cles + '</p></div>' : '')
      + '<div><div class="art-block__label">' + (l==='en'?'Recommended stance':'Biais recommandé') + '</div>'
      + biasBadge(dp.biais_recommande) + '</div>'
      + '</div></section>';

    // ── Conclusion ──
    html += '<div class="art-conclusion">' + a.conclusion + '</div>';

    // ── Lien source ──
    if (article.url) {
      html += '<div style="text-align:center;margin-top:8px">'
        + '<a class="btn" href="' + article.url + '" target="_blank" rel="noopener nofollow" '
        + 'style="display:inline-flex;gap:8px;text-decoration:none">'
        + '<span>' + (l==='en'?'Read full article on ':'Lire l\'article complet sur ') + (article.source||'la source') + '</span>'
        + '<span aria-hidden="true">↗</span></a></div>';
    }

    wrap.innerHTML = html;
    document.title = 'Le Terminal — ' + (a.titre_analyse || article.title).slice(0,60);
  }

  async function load() {
    if (!id) { renderError(getLang()==='en' ? 'No article specified.' : 'Aucun article spécifié.'); return; }

    // Affiche le spinner
    wrap.innerHTML = '<div class="art-loading">'
      + '<div class="art-spinner"></div>'
      + '<div>'
      + '<p class="art-loading-text">' + (getLang()==='en'?'Generating analysis…':'Génération de l\'analyse en cours…') + '</p>'
      + '<p class="art-loading-sub">' + (getLang()==='en'?'Claude is reading the article for you.':'Claude lit l\'article pour vous.') + '</p>'
      + '</div></div>';

    try {
      var resp = await fetch('/api/article?id=' + encodeURIComponent(id));
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      var data = await resp.json();
      if (!data.article) throw new Error('not found');
      renderArticle(data.article, data.analysis);
    } catch(e) {
      renderError(getLang()==='en'
        ? 'Unable to load this article. <a href="javascript:history.back()">Go back</a>.'
        : 'Impossible de charger cet article. <a href="javascript:history.back()">Retour</a>.');
    }
  }

  // Recharge si langue change (pour ré-afficher dans la bonne langue)
  window.ecoReloadNews = load;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', load);
  } else { load(); }
})();
</script>
</body>
</html>
