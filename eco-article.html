<style>
/* ═══════════════════════════════════════════════════
   ZONE PALETTES
═══════════════════════════════════════════════════ */
:root {
  --zone-europe:       #5A9BD4, #7FB8E8;
  --zone-ameriques:    #5A9BD4, #BFDCF5;
  --zone-asie:         #4ADE9C, #7FB8E8;
  --zone-institutions: #7E8794, #BFDCF5;
  --zone-marches:      #5A9BD4, #7FB8E8;
  --zone-crypto:       #E8C268, #BFDCF5;
}

/* ═══════════════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════════════ */
.art-page { max-width: 860px; margin: 0 auto; padding-bottom: 100px; }

/* ── Bouton retour ─────────────────────────────── */
.art-back-bar {
  padding: 18px 28px 0;
  max-width: 860px; margin: 0 auto;
}
.art-back {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text3); text-decoration: none;
  padding: 6px 12px; border: 1px solid var(--border); border-radius: 20px;
  transition: all 0.2s; background: rgba(255,255,255,0.02);
}
.art-back:hover { color: var(--text); border-color: var(--v2); background: rgba(127,184,232,0.06); }

/* ═══════════════════════════════════════════════════
   HERO
═══════════════════════════════════════════════════ */
.art-hero {
  position: relative; overflow: hidden;
  border-radius: 20px; margin: 16px 24px 0;
  min-height: 280px;
  display: flex; flex-direction: column; justify-content: flex-end;
  background: var(--card); border: 1px solid var(--border);
}

/* Gradient overlay toujours présent (au-dessus de l'image) */
.art-hero__overlay {
  position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(180deg,
    rgba(8,12,20,0.10) 0%,
    rgba(8,12,20,0.55) 45%,
    rgba(8,12,20,0.92) 100%);
}

/* Image de fond (og:image) */
.art-hero__img {
  position: absolute; inset: 0; z-index: 0;
  width: 100%; height: 100%; object-fit: cover;
  filter: saturate(0.85) brightness(0.9);
  transition: transform 6s ease;
}
.art-hero:hover .art-hero__img { transform: scale(1.02); }

/* SVG fallback — zone graphic (shown when no image) */
.art-hero__svg {
  position: absolute; inset: 0; z-index: 0;
  width: 100%; height: 100%;
}

/* Contenu hero */
.art-hero__body {
  position: relative; z-index: 2;
  padding: 28px 32px 32px;
}

.art-hero__badges {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-bottom: 14px;
}
.art-hero__zone {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: rgba(255,255,255,0.85);
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
  padding: 4px 10px; border-radius: 20px; backdrop-filter: blur(4px);
}
.art-hero__source {
  font-size: 11px; color: rgba(255,255,255,0.6);
  background: rgba(0,0,0,0.3); padding: 4px 10px;
  border-radius: 20px; border: 1px solid rgba(255,255,255,0.12);
}
.art-hero__time {
  font-size: 11px; color: rgba(255,255,255,0.5);
  margin-left: auto;
}

.art-hero__title {
  font-family: var(--display);
  font-size: clamp(20px, 3.5vw, 32px);
  font-weight: 800; line-height: 1.15;
  letter-spacing: -0.02em;
  color: #fff;
  text-shadow: 0 2px 20px rgba(0,0,0,0.5);
  margin-bottom: 14px;
}

.art-hero__lead {
  font-size: 14px; line-height: 1.65;
  color: rgba(255,255,255,0.75);
  max-width: 640px;
  font-weight: 300;
}

/* ═══════════════════════════════════════════════════
   MÉTRIQUES VISUELLES (bande sous le hero)
═══════════════════════════════════════════════════ */
.art-metrics {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1px; margin: 0 24px;
  background: var(--border);
  border: 1px solid var(--border); border-top: none;
  border-radius: 0 0 16px 16px; overflow: hidden;
}
.art-metric {
  background: var(--card);
  padding: 14px 18px;
  display: flex; flex-direction: column; gap: 4px;
}
.art-metric__label {
  font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text3);
}
.art-metric__value {
  font-size: 14px; font-weight: 600; color: var(--text);
  display: flex; align-items: center; gap: 6px;
}
.art-metric__dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.dot--pos  { background: var(--green); box-shadow: 0 0 6px var(--green); }
.dot--neg  { background: var(--red);   box-shadow: 0 0 6px var(--red); }
.dot--flat { background: var(--text3); }

/* ═══════════════════════════════════════════════════
   CORPS DE L'ANALYSE
═══════════════════════════════════════════════════ */
.art-body { padding: 28px 24px 0; display: flex; flex-direction: column; gap: 16px; }

/* ── Sections (débutants / pro) ─────────────────── */
.art-section {
  border: 1px solid var(--border); border-radius: 16px;
  overflow: hidden;
  animation: rise 0.5s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
.art-section--beg  { border-color: rgba(74,222,156,0.25); }
.art-section--pro  { border-color: rgba(127,184,232,0.22); }

.art-section__head {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 20px; border-bottom: 1px solid var(--border);
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
}
.art-section--beg .art-section__head {
  background: linear-gradient(90deg, rgba(74,222,156,0.08), transparent);
  color: var(--green); border-color: rgba(74,222,156,0.15);
}
.art-section--pro .art-section__head {
  background: linear-gradient(90deg, rgba(127,184,232,0.08), transparent);
  color: var(--v2); border-color: rgba(127,184,232,0.12);
}
.art-section__head svg { flex-shrink: 0; }

.art-section__grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0;
}
@media (max-width:640px) { .art-section__grid { grid-template-columns: 1fr; } }

.art-block {
  padding: 20px 22px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
}
.art-block:nth-child(even) { border-right: none; }
.art-block:nth-last-child(-n+2) { border-bottom: none; }
@media (max-width:640px) {
  .art-block { border-right: none; }
  .art-block:last-child { border-bottom: none; }
}
.art-block--full { grid-column: 1 / -1; border-right: none; }

.art-block__label {
  font-size: 9px; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text3); margin-bottom: 8px;
  display: flex; align-items: center; gap: 5px;
}
.art-block__label::before {
  content: ''; width: 3px; height: 12px; border-radius: 2px;
  background: currentColor; opacity: 0.5;
}
.art-section--beg .art-block__label { color: var(--green); }
.art-section--pro .art-block__label { color: var(--v2); }

.art-block__text {
  font-size: 14px; line-height: 1.72; color: var(--text2); font-weight: 300;
}

/* Mot-clé */
.art-keyword {
  display: block; background: rgba(74,222,156,0.06);
  border: 1px solid rgba(74,222,156,0.2); border-radius: 10px;
  padding: 12px 16px; font-size: 13px; line-height: 1.6; color: var(--text2);
}

/* Biais */
.art-biais {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 16px; border-radius: 10px;
  font-size: 13px; font-weight: 600; letter-spacing: 0.01em;
}
.art-biais--on   { background: rgba(74,222,156,0.1); color: var(--green); border: 1px solid rgba(74,222,156,0.25); }
.art-biais--off  { background: rgba(240,100,122,0.1); color: var(--red);   border: 1px solid rgba(240,100,122,0.25); }
.art-biais--wait { background: rgba(148,163,184,0.08); color: var(--text2); border: 1px solid var(--border); }

/* ── Conclusion ─────────────────────────────────── */
.art-conclusion {
  background: linear-gradient(135deg, rgba(127,184,232,0.06), rgba(74,222,156,0.04));
  border: 1px solid rgba(127,184,232,0.18); border-radius: 16px;
  padding: 22px 28px;
  font-family: var(--display);
  font-size: 17px; font-weight: 700; line-height: 1.4;
  color: var(--text); text-align: center;
  position: relative; overflow: hidden;
}
.art-conclusion::before {
  content: '"'; position: absolute; top: -10px; left: 16px;
  font-size: 80px; color: rgba(127,184,232,0.08);
  font-family: Georgia, serif; line-height: 1;
}

/* ── Source CTA ─────────────────────────────────── */
.art-source-cta {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  flex-wrap: wrap; padding: 8px 0 4px;
}

/* ── Erreur ─────────────────────────────────────── */
.art-error {
  text-align: center; padding: 80px 24px; color: var(--text3);
}
.art-error-icon { font-size: 48px; margin-bottom: 16px; }
.art-error p { font-size: 15px; margin-bottom: 12px; }
.art-error a { color: var(--v2); text-decoration: none; }

/* ── Spinner ─────────────────────────────────────── */
.art-loading {
  display: flex; flex-direction: column; align-items: center;
  gap: 20px; padding: 100px 24px; color: var(--text3);
}
.art-spinner {
  width: 42px; height: 42px;
  border: 2px solid var(--border); border-top-color: var(--v);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.art-loading p { font-size: 14px; text-align: center; line-height: 1.6; }
.art-loading small { font-size: 12px; color: var(--text3); }

/* ── Skeleton ────────────────────────────────────── */
.art-skel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
.art-skel-line {
  height: 14px; border-radius: 8px; margin-bottom: 12px;
  background: linear-gradient(90deg, var(--border) 25%, rgba(255,255,255,0.07) 50%, var(--border) 75%);
  background-size: 800px 100%; animation: shimmer 1.5s infinite linear;
}
.art-skel-line--h { height: 220px; margin-bottom: 0; border-radius: 12px; }
.art-skel-line--title { height: 28px; width: 80%; margin: 16px 0 20px; }
.art-skel-line--short { width: 45%; }
.art-skel-line--med   { width: 70%; }
</style>

<script>
(function () {
  'use strict';

  var params = new URLSearchParams(window.location.search);
  var id     = params.get('id');
  var srcUrl = params.get('src');   // URL externe de secours
  var root   = document.getElementById('artRoot');

  /* ── Config zones ──────────────────────────────────────────────────────── */
  var ZONE_CFG = {
    europe:       { fr:'Europe',       en:'Europe',       g1:'#5A9BD4', g2:'#7FB8E8', icon:'<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/></svg>' },
    ameriques:    { fr:'Amériques',    en:'Americas',     g1:'#7FB8E8', g2:'#5A9BD4', icon:'<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/></svg>' },
    asie:         { fr:'Asie',         en:'Asia',         g1:'#4ADE9C', g2:'#7FB8E8', icon:'<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/></svg>' },
    institutions: { fr:'Institutions', en:'Institutions', g1:'#5A9BD4', g2:'#7FB8E8', icon:'<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M3.5 9.5 12 4l8.5 5.5"/><path d="M5.5 10v8M9.5 10v8M14.5 10v8M18.5 10v8"/><path d="M3 20.5h18"/></svg>' },
    marches:      { fr:'Marchés',      en:'Markets',      g1:'#7FB8E8', g2:'#5A9BD4', icon:'<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>' },
    crypto:       { fr:'Crypto',       en:'Crypto',       g1:'#E8C268', g2:'#7FB8E8', icon:'₿'  },
  };

  var SENT_CFG = {
    'Positif': { fr:'Positif', en:'Positive', cls:'dot--pos',  badge:'bias--up'   },
    'Négatif': { fr:'Négatif', en:'Negative', cls:'dot--neg',  badge:'bias--down' },
    'Neutre':  { fr:'Neutre',  en:'Neutral',  cls:'dot--flat', badge:'bias--flat' },
  };
  // Rétrocompat
  SENT_CFG['Risk-on']  = { fr:'Confiance',   en:'Confidence', cls:'dot--pos', badge:'bias--up'   };
  SENT_CFG['Risk-off'] = { fr:'Prudence',    en:'Caution',    cls:'dot--neg', badge:'bias--down' };
  SENT_CFG['Hawkish']  = { fr:'Restrictif',  en:'Tightening', cls:'dot--pos', badge:'bias--up'   };
  SENT_CFG['Dovish']   = { fr:'Accommodant', en:'Easing',     cls:'dot--neg', badge:'bias--down' };

  function getLang() { return localStorage.getItem('lt_lang') || 'fr'; }
  function esc(s)    { return (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function fmt(iso) {
    try {
      return new Date(iso).toLocaleDateString(getLang()==='en'?'en-GB':'fr-FR',
        { day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' });
    } catch(e) { return ''; }
  }

  function relTime(iso) {
    try {
      var m = Math.floor((Date.now() - new Date(iso)) / 60000);
      if (m < 1)  return getLang()==='en' ? 'Just now'   : 'À l\'instant';
      if (m < 60) return getLang()==='en' ? m+'m ago'    : 'Il y a '+m+' min';
      var h = Math.floor(m/60);
      if (h < 24) return getLang()==='en' ? h+'h ago'    : 'Il y a '+h+'h';
      return getLang()==='en' ? Math.floor(h/24)+'d ago' : 'Il y a '+Math.floor(h/24)+'j';
    } catch(e) { return ''; }
  }

  /* ── SVG hero fallback (zone-specific) ─────────────────────────────────── */
  function buildHeroSvg(zone, g1, g2) {
    var id1 = 'g'+Math.random().toString(36).slice(2,7);
    var id2 = 'g'+Math.random().toString(36).slice(2,7);
    // Génère des points de courbe pseudo-aléatoires mais déterministes selon zone
    var seed = zone.split('').reduce(function(a,c){ return a+c.charCodeAt(0); },0);
    var pts  = '';
    var prevY = 120;
    for (var i=0; i<=10; i++) {
      var x = i * 86;
      seed = (seed * 1664525 + 1013904223) & 0xffffffff;
      var y = 60 + (((seed >>> 0) % 120));
      pts += (i===0 ? 'M' : ' L') + x + ',' + y;
      prevY = y;
    }
    return '<svg class="art-hero__svg" viewBox="0 0 860 280" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">'
      + '<defs>'
      + '<linearGradient id="'+id1+'" x1="0%" y1="0%" x2="100%" y2="100%">'
      + '<stop offset="0%" style="stop-color:'+g1+';stop-opacity:1"/>'
      + '<stop offset="100%" style="stop-color:'+g2+';stop-opacity:0.8"/>'
      + '</linearGradient>'
      + '<linearGradient id="'+id2+'" x1="0%" y1="0%" x2="0%" y2="100%">'
      + '<stop offset="0%" style="stop-color:'+g1+';stop-opacity:0.3"/>'
      + '<stop offset="100%" style="stop-color:'+g2+';stop-opacity:0"/>'
      + '</linearGradient>'
      + '</defs>'
      + '<rect width="860" height="280" fill="url(#'+id1+')"/>'
      /* Grid pattern */
      + '<g stroke="rgba(255,255,255,0.06)" stroke-width="1">'
      + '<line x1="0" y1="70"  x2="860" y2="70"/>'
      + '<line x1="0" y1="140" x2="860" y2="140"/>'
      + '<line x1="0" y1="210" x2="860" y2="210"/>'
      + '<line x1="172" y1="0" x2="172" y2="280"/>'
      + '<line x1="344" y1="0" x2="344" y2="280"/>'
      + '<line x1="516" y1="0" x2="516" y2="280"/>'
      + '<line x1="688" y1="0" x2="688" y2="280"/>'
      + '</g>'
      /* Courbe principale */
      + '<path d="'+pts+'" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" stroke-linejoin="round"/>'
      /* Aire sous la courbe */
      + '<path d="'+pts+' L860,280 L0,280 Z" fill="url(#'+id2+')" opacity="0.4"/>'
      /* Points */
      + '<circle cx="860" cy="'+prevY+'" r="5" fill="rgba(255,255,255,0.9)"/>'
      + '<circle cx="860" cy="'+prevY+'" r="10" fill="rgba(255,255,255,0.2)"/>'
      /* Dots décoratifs */
      + '<circle cx="80" cy="230" r="40" fill="rgba(255,255,255,0.04)"/>'
      + '<circle cx="780" cy="40" r="60" fill="rgba(255,255,255,0.04)"/>'
      + '</svg>';
  }

  /* ── Render principal ──────────────────────────────────────────────────── */
  function render(article, analysis, imageUrl) {
    var l   = getLang();
    var a   = analysis ? (analysis[l] || analysis['fr']) : null;
    var z   = ZONE_CFG[article.zone] || ZONE_CFG['marches'];
    var s   = SENT_CFG[article.sentiment] || SENT_CFG['Neutre'];
    var sum = (l==='en' && article.summary_en) ? article.summary_en : (article.summary||'');

    document.title = 'Le Terminal — ' + ((a && a.titre_analyse) || article.title || 'Analyse').slice(0,60);

    var html = '<div class="art-page">';

    /* ── HERO ─────────────────────────────────────────── */
    html += '<div class="art-hero">';

    if (imageUrl) {
      html += '<img class="art-hero__img" src="'+esc(imageUrl)+'" alt="" loading="eager" onerror="this.style.display=\'none\'">';
    } else {
      html += buildHeroSvg(article.zone||'marches', z.g1, z.g2);
    }

    html += '<div class="art-hero__overlay"></div>';
    html += '<div class="art-hero__body">';

    // Badges
    html += '<div class="art-hero__badges">'
      + '<span class="art-hero__zone">'+z.icon+' '+(l==='en'?z.en:z.fr)+'</span>'
      + '<span class="bias '+s.badge+'" style="font-size:10px;padding:3px 10px">'+( l==='en'?s.en:s.fr )+'</span>'
      + (article.source ? '<span class="art-hero__source">'+esc(article.source)+'</span>' : '')
      + '<span class="art-hero__time">'+relTime(article.published_at)+'</span>'
      + '</div>';

    // Titre
    var displayTitle = (a && a.titre_analyse) ? esc(a.titre_analyse) : esc(article.title||'');
    html += '<h1 class="art-hero__title">'+displayTitle+'</h1>';

    // Lead (résumé)
    if (sum) {
      html += '<p class="art-hero__lead">'+esc(sum)+'</p>';
    }

    html += '</div></div>'; // hero__body + art-hero

    /* ── MÉTRIQUES ────────────────────────────────────── */
    html += '<div class="art-metrics">'
      + '<div class="art-metric">'
      + '<span class="art-metric__label">'+(l==='en'?'Zone':'Zone')+'</span>'
      + '<span class="art-metric__value">'+z.icon+' '+(l==='en'?z.en:z.fr)+'</span>'
      + '</div>'
      + '<div class="art-metric">'
      + '<span class="art-metric__label">'+(l==='en'?'Sentiment':'Sentiment')+'</span>'
      + '<span class="art-metric__value"><span class="art-metric__dot '+s.cls+'"></span>'+(l==='en'?s.en:s.fr)+'</span>'
      + '</div>'
      + '<div class="art-metric">'
      + '<span class="art-metric__label">'+(l==='en'?'Published':'Publié')+'</span>'
      + '<span class="art-metric__value" style="font-size:12px">'+fmt(article.published_at)+'</span>'
      + '</div>'
      + '</div>';

    /* ── ANALYSE ──────────────────────────────────────── */
    html += '<div class="art-body">';

    if (a) {
      var db = a.pour_les_debutants || {};
      var dp = a.pour_les_professionnels || {};

      // Section débutants
      html += '<section class="art-section art-section--beg" style="animation-delay:0.1s">'
        + '<div class="art-section__head">'
        + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'
        + (l==='en' ? 'For beginners — understand the basics' : 'Pour les débutants — comprendre l\'essentiel')
        + '</div>'
        + '<div class="art-section__grid">'

        + '<div class="art-block">'
        + '<div class="art-block__label">'+(l==='en'?'What happened':'Ce qui se passe')+'</div>'
        + '<p class="art-block__text">'+esc(db.ce_qui_se_passe||'')+'</p>'
        + '</div>'

        + '<div class="art-block">'
        + '<div class="art-block__label">'+(l==='en'?'Why it matters':'Pourquoi c\'est important')+'</div>'
        + '<p class="art-block__text">'+esc(db.pourquoi_cest_important||'')+'</p>'
        + '</div>'

        + '<div class="art-block art-block--full">'
        + '<div class="art-block__label">'+(l==='en'?'Key term to know':'Le mot clé à retenir')+'</div>'
        + '<span class="art-keyword">'+esc(db.le_mot_cle||'')+'</span>'
        + '</div>'

        + '</div></section>';

      // Section pro
      html += '<section class="art-section art-section--pro" style="animation-delay:0.2s">'
        + '<div class="art-section__head">'
        + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>'
        + (l==='en' ? 'For professionals — market analysis' : 'Pour les professionnels — analyse marché')
        + '</div>'
        + '<div class="art-section__grid">'

        + '<div class="art-block">'
        + '<div class="art-block__label">'+(l==='en'?'Macro analysis':'Analyse macro')+'</div>'
        + '<p class="art-block__text">'+esc(dp.analyse_macro||'')+'</p>'
        + '</div>'

        + '<div class="art-block">'
        + '<div class="art-block__label">'+(l==='en'?'Market impact':'Impact marchés')+'</div>'
        + '<p class="art-block__text">'+esc(dp.impact_marches||'')+'</p>'
        + '</div>'

        + (dp.niveaux_cles && dp.niveaux_cles !== 'N/A' ?
          '<div class="art-block">'
          + '<div class="art-block__label">'+(l==='en'?'Key levels':'Niveaux clés')+'</div>'
          + '<p class="art-block__text">'+esc(dp.niveaux_cles)+'</p>'
          + '</div>' : '')

        + '<div class="art-block">'
        + '<div class="art-block__label">'+(l==='en'?'Recommended stance':'Biais recommandé')+'</div>'
        + buildBiais(dp.biais_recommande)
        + '</div>'

        + '</div></section>';

      // Conclusion
      html += '<div class="art-conclusion" style="animation:rise 0.5s 0.35s both">'+esc(a.conclusion)+'</div>';
    } else {
      // Pas d'analyse — affiche le résumé
      html += '<div class="art-conclusion">'+esc(sum || (l==='en'?'No analysis available.':'Analyse non disponible.'))+'</div>';
    }

    // CTA source
    if (article.url) {
      html += '<div class="art-source-cta">'
        + '<a class="btn" href="'+esc(article.url)+'" target="_blank" rel="noopener nofollow">'
        + '<span>'+(l==='en'?'Read full article on ':'Lire l\'article complet sur ')+(article.source||'la source')+'</span>'
        + '<span class="btn__arrow" aria-hidden="true">↗</span></a>'
        + '</div>';
    }

    html += '</div>'; // art-body
    html += '</div>'; // art-page

    root.innerHTML = html;
  }

  function buildBiais(text) {
    if (!text) return '';
    var lo = text.toLowerCase();
    var cls = lo.includes('risk-on') ? 'art-biais--on'
            : lo.includes('risk-off') ? 'art-biais--off'
            : 'art-biais--wait';
    return '<span class="art-biais '+cls+'">'+esc(text)+'</span>';
  }

  function showError(msg) {
    root.innerHTML = '<div class="art-error">'
      + '<div class="art-error-icon"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8M15 18h-5M10 6h8v4h-8z"/></svg></div>'
      + '<p>'+msg+'</p>'
      + '<p><a href="javascript:history.back()">← '+(getLang()==='en'?'Go back':'Retour')+'</a></p>'
      + '</div>';
  }

  function showSpinner() {
    var l = getLang();
    root.innerHTML = '<div class="art-loading">'
      + '<div class="art-spinner"></div>'
      + '<p>'+(l==='en'?'Generating analysis…':'Génération de l\'analyse…')+'<br>'
      + '<small>'+(l==='en'?'Claude is reading the article for you.':'Claude analyse l\'article pour vous.')+'</small></p>'
      + '</div>';
  }

  async function load() {
    if (!id) {
      showError(getLang()==='en' ? 'No article specified.' : 'Aucun article spécifié.');
      return;
    }
    // Accès : Premium = illimité ; sinon 1 token par annonce (mis en cache pour ne pas re-débiter au refresh)
    var _isPro = localStorage.getItem('lt_pro')==='1';
    var _tok = localStorage.getItem('ta_token');
    if(!_isPro){
      var _l0 = getLang();
      if(!_tok){
        root.innerHTML = '<div style="text-align:center;padding:60px 20px">'
          + '<div style="margin-bottom:16px;color:#7FB8E8"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>'
          + '<div style="font-family:\'Anton\',\'Arial Narrow\',sans-serif;text-transform:uppercase;font-size:22px;color:#F2F4F7;margin-bottom:10px">'+(_l0==='en'?'Sign in required':'Connexion requise')+'</div>'
          + '<p style="color:#7E8794;font-size:14px;margin-bottom:24px">'+(_l0==='en'?'Create a free account to analyze announcements.':'Crée un compte gratuit pour analyser les annonces.')+'</p>'
          + '<a href="./index.html" style="display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#7FB8E8,#5A9BD4);border-radius:10px;color:#07090C;font-family:\'Inter\',system-ui,-apple-system,sans-serif;font-size:14px;font-weight:700;text-decoration:none">'+(_l0==='en'?'Sign in':'Se connecter')+'</a></div>';
        return;
      }
      var _unlockedRaw = localStorage.getItem('eco_unlocked')||'[]';
      var _unlocked; try{ _unlocked = JSON.parse(_unlockedRaw); }catch(e){ _unlocked=[]; }
      if(_unlocked.indexOf(id)===-1){
        try{
          var _tr = await fetch('/api/tokens',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+_tok},body:JSON.stringify({action:'spend',reason:'eco'})});
          var _td = await _tr.json();
          if(_td.unlimited){ localStorage.setItem('lt_pro','1'); }
          else if(_td.ok){ _unlocked.push(id); localStorage.setItem('eco_unlocked', JSON.stringify(_unlocked)); }
          else {
            root.innerHTML = '<div style="text-align:center;padding:60px 20px">'
              + '<div style="margin-bottom:16px;color:#E8C268"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>'
              + '<div style="font-family:\'Anton\',\'Arial Narrow\',sans-serif;text-transform:uppercase;font-size:22px;color:#F2F4F7;margin-bottom:10px">'+(_l0==='en'?'Out of tokens':'Plus de tokens')+'</div>'
              + '<p style="color:#7E8794;font-size:14px;margin-bottom:24px;line-height:1.7">'+(_l0==='en'?'You have no tokens left. Go Premium for unlimited analyses.':'Tu n\'as plus de tokens. Passe en Premium pour des analyses illimitées.')+'</p>'
              + '<a href="./tarifs.html" style="display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#7FB8E8,#5A9BD4);border-radius:10px;color:#07090C;font-family:\'Inter\',system-ui,-apple-system,sans-serif;font-size:14px;font-weight:700;text-decoration:none">'+(_l0==='en'?'Go Premium':'Passer en Premium')+'</a></div>';
            return;
          }
        }catch(e){ /* erreur réseau : on laisse passer */ }
      }
    }
    showSpinner();
    try {
      // _t= force une requête fraîche (bypass CDN et cache navigateur)
      var resp = await fetch('/api/article?id=' + encodeURIComponent(id) + '&_t=' + Date.now());
      if (resp.status === 404 || resp.status === 400) {
        if (srcUrl) { window.location.replace(srcUrl); return; }
        var l2 = getLang();
        showError(
          (l2==='en' ? 'This article is no longer available.' : 'Cet article n\'est plus disponible.')
          + '<br><a class="btn" href="./eco-edition.html" style="margin-top:16px;display:inline-flex">← '
          + (l2==='en' ? 'Back to news' : 'Retour aux actualités') + '</a>'
        );
        return;
      }
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      var data = await resp.json();
      if (!data.article) throw new Error('not found');
      render(data.article, data.analysis, data.image_url || null);
    } catch(e) {
      var l = getLang();
      console.error('[eco-article] error:', e);
      var fallback = srcUrl
        ? '<br><a class="btn" href="' + srcUrl + '" target="_blank" rel="noopener" style="margin-top:12px;display:inline-flex">'
          + (l==='en' ? 'Read source article ↗' : 'Lire l\'article source ↗') + '</a>'
        : '<br><a class="btn" href="./eco-edition.html" style="margin-top:12px;display:inline-flex">← '
          + (l==='en' ? 'Back to news' : 'Retour aux actualités') + '</a>';
      showError((l==='en' ? 'Unable to load this article.' : 'Impossible de charger cet article.') + fallback);
    }
  }

  // Recharge quand la langue change
  window.ecoReloadNews = load;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', load);
  } else {
    load();
  }
})();
</script>
</body>
</html>
