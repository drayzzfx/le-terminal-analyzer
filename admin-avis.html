<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Terminal — Admin</title>
<link rel="stylesheet" href="./fonts.css">
<link rel="stylesheet" href="./design-system.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-void);color:var(--text-body);font-family:var(--font-ui);min-height:100vh}

/* AUTH */
#authGate{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.ag-box{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-lg);padding:40px 36px;width:100%;max-width:360px;text-align:center}
.ag-box h1{font-family:var(--font-display);font-size:22px;text-transform:uppercase;color:var(--text-title);letter-spacing:.06em;margin-bottom:6px}
.ag-box p{font-size:13px;color:var(--text-muted);margin-bottom:24px}
.ag-in{width:100%;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px;color:var(--text-title);font-family:var(--font-ui);font-size:14px;outline:none;margin-bottom:12px}
.ag-in:focus{border-color:var(--accent)}
.ag-err{font-size:12px;color:var(--bear);margin-top:8px;min-height:18px}

/* LAYOUT */
#admin{display:none}
.adm-nav{background:var(--bg-card);border-bottom:1px solid var(--border-subtle);padding:0 28px;display:flex;align-items:center;gap:0}
.adm-nav h1{font-family:var(--font-display);font-size:16px;text-transform:uppercase;color:var(--text-title);letter-spacing:.08em;margin-right:32px;white-space:nowrap}
.adm-tab{padding:16px 18px;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--text-muted);font-family:var(--font-ui);font-size:13px;font-weight:500;cursor:pointer;transition:all .18s;white-space:nowrap}
.adm-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.adm-tab:hover:not(.active){color:var(--text-title)}
.adm-badge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;border-radius:99px;background:var(--bear);color:#fff;font-size:10px;font-weight:700;padding:0 4px;margin-left:5px}
.adm-body{padding:28px 28px 60px;max-width:1280px;margin:0 auto}

/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:28px}
.kpi{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--r-lg);padding:18px 20px}
.kpi__label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);margin-bottom:8px}
.kpi__val{font-family:var(--font-mono);font-size:32px;font-weight:700;color:var(--text-title);line-height:1}
.kpi__sub{font-size:11px;color:var(--text-muted);margin-top:6px}
.kpi--accent .kpi__val{color:var(--accent)}
.kpi--bull .kpi__val{color:var(--bull)}
.kpi--bear .kpi__val{color:var(--bear)}
.kpi--warn .kpi__val{color:var(--neutral)}

/* CHARTS */
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
@media(max-width:800px){.charts-row{grid-template-columns:1fr}}
.chart-box{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--r-lg);padding:20px 22px}
.chart-box h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);margin-bottom:16px}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:80px}
.bar-chart__col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar-chart__bar{width:100%;border-radius:2px 2px 0 0;background:linear-gradient(180deg,var(--accent),rgba(127,184,232,.3));min-height:2px;transition:height .3s}
.bar-chart__lbl{font-family:var(--font-mono);font-size:9px;color:var(--text-muted);transform:rotate(-45deg);white-space:nowrap}

/* TOP PAGES */
.pages-list{display:flex;flex-direction:column;gap:6px}
.page-row{display:flex;align-items:center;gap:10px}
.page-row__name{font-size:13px;color:var(--text-body);flex:1;font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page-row__bar-wrap{width:120px;height:6px;background:var(--bg-elevated);border-radius:99px;overflow:hidden}
.page-row__bar{height:100%;border-radius:99px;background:var(--accent)}
.page-row__count{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);width:32px;text-align:right}

/* TABLES */
.tbl-box{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:16px}
.tbl-box h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:7px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);border-bottom:1px solid var(--border-subtle)}
td{padding:9px 10px;border-bottom:1px solid var(--border-subtle);color:var(--text-body)}
tr:last-child td{border-bottom:none}
.badge-pro{display:inline-block;padding:2px 8px;border-radius:4px;background:rgba(74,222,156,.12);border:1px solid rgba(74,222,156,.3);color:#4ADE9C;font-size:11px;font-weight:600}
.badge-free{display:inline-block;padding:2px 8px;border-radius:4px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-muted);font-size:11px}

/* REVIEWS */
.adm-grid{display:flex;flex-direction:column;gap:12px}
.adm-card{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--r-lg);padding:20px 22px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.adm-card__meta{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.adm-card__name{font-weight:600;font-size:14px;color:var(--text-title)}
.adm-card__role{font-size:12px;color:var(--text-muted)}
.adm-card__stars{display:flex;gap:3px;color:#E8C268}
.adm-card__date{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-left:auto}
.adm-card__email{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.adm-card__body{font-size:13.5px;color:var(--text-body);line-height:1.6;margin-top:10px}
.adm-card__actions{display:flex;flex-direction:column;gap:8px;min-width:110px}
.btn-approve{padding:8px 14px;background:rgba(74,222,156,.1);border:1px solid rgba(74,222,156,.3);border-radius:var(--r-sm);color:#4ADE9C;font-family:var(--font-ui);font-size:12px;font-weight:600;cursor:pointer;width:100%}
.btn-approve:hover{background:rgba(74,222,156,.2)}
.btn-delete{padding:8px 14px;background:rgba(240,100,122,.08);border:1px solid rgba(240,100,122,.25);border-radius:var(--r-sm);color:#F0647A;font-family:var(--font-ui);font-size:12px;font-weight:600;cursor:pointer;width:100%}
.btn-delete:hover{background:rgba(240,100,122,.16)}
.btn-unapprove{padding:8px 14px;background:rgba(232,194,104,.08);border:1px solid rgba(232,194,104,.25);border-radius:var(--r-sm);color:#E8C268;font-family:var(--font-ui);font-size:12px;font-weight:600;cursor:pointer;width:100%}
.btn-unapprove:hover{background:rgba(232,194,104,.16)}
.adm-empty{text-align:center;padding:60px 24px;color:var(--text-muted);font-size:14px}
.adm-loader{text-align:center;padding:40px;color:var(--text-muted);font-size:13px}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);margin:24px 0 12px}
</style>
</head>
<body>

<div id="authGate">
  <div class="ag-box">
    <h1>Le Terminal</h1>
    <p>Administration — accès restreint</p>
    <input class="ag-in" id="agPass" type="password" placeholder="Mot de passe admin" autocomplete="current-password">
    <button class="lt-btn lt-btn--primary" style="width:100%" id="agBtn">Accéder</button>
    <div class="ag-err" id="agErr"></div>
  </div>
</div>

<div id="admin">
  <nav class="adm-nav">
    <h1>Admin</h1>
    <button class="adm-tab active" id="tabStats" onclick="showTab('stats')">Statistiques</button>
    <button class="adm-tab" id="tabPending" onclick="showTab('pending')">En attente <span id="badgePending" class="adm-badge" style="display:none"></span></button>
    <button class="adm-tab" id="tabApproved" onclick="showTab('approved')">Publiés</button>
  </nav>
  <div class="adm-body">
    <div id="panelStats"></div>
    <div id="panelPending" style="display:none"></div>
    <div id="panelApproved" style="display:none"></div>
  </div>
</div>

<script>
var ADMIN_PASS='leterminal-admin-2026';
var STATS_API='/api/admin-stats';
var REVIEWS_API='/api/admin-reviews';
var curTab='stats';
var reviewData={pending:[],approved:[]};
var statsLoaded=false;

// ── Auth ──
document.getElementById('agBtn').onclick=function(){
  var p=document.getElementById('agPass').value.trim();
  if(p!==ADMIN_PASS){document.getElementById('agErr').textContent='Mot de passe incorrect.';return;}
  document.getElementById('authGate').style.display='none';
  document.getElementById('admin').style.display='block';
  loadAll();
};
document.getElementById('agPass').onkeydown=function(e){if(e.key==='Enter')document.getElementById('agBtn').click();};

function showTab(tab){
  curTab=tab;
  ['stats','pending','approved'].forEach(function(t){
    document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).className='adm-tab'+(t===tab?' active':'');
    document.getElementById('panel'+t.charAt(0).toUpperCase()+t.slice(1)).style.display=t===tab?'':'none';
  });
}

function loadAll(){
  loadStats();
  loadReviews();
}

// ── STATS ──
function fmtDur(s){if(!s)return '—';if(s<60)return s+'s';return Math.floor(s/60)+'m '+( s%60)+'s';}
function fmtDate(iso){try{return new Date(iso).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});}catch(e){return '';}}

function loadStats(){
  document.getElementById('panelStats').innerHTML='<div class="adm-loader">Chargement des statistiques…</div>';
  fetch(STATS_API,{headers:{'X-Admin-Pass':ADMIN_PASS}})
  .then(function(r){return r.json();})
  .then(function(d){renderStats(d);})
  .catch(function(){document.getElementById('panelStats').innerHTML='<div class="adm-empty">Erreur de chargement.</div>';});
}

function renderStats(d){
  var u=d.users||{};
  var t=d.traffic||{};
  var c=d.charts||{};
  var co=d.content||{};

  var maxViews=Math.max.apply(null,(c.daily_views||[]).map(function(x){return x.count;})||[1]);
  var maxSignups=Math.max.apply(null,(c.daily_signups||[]).map(function(x){return x.count;})||[1]);

  var barsViews=(c.daily_views||[]).map(function(x){
    var h=maxViews>0?Math.round((x.count/maxViews)*76):2;
    var lbl=x.date?x.date.slice(5):'';
    return '<div class="bar-chart__col"><div class="bar-chart__bar" style="height:'+h+'px" title="'+x.count+' vues le '+x.date+'"></div><span class="bar-chart__lbl">'+lbl+'</span></div>';
  }).join('');

  var barsSignups=(c.daily_signups||[]).map(function(x){
    var h=maxSignups>0?Math.round((x.count/maxSignups)*76):2;
    var lbl=x.date?x.date.slice(5):'';
    return '<div class="bar-chart__col"><div class="bar-chart__bar" style="height:'+Math.max(h,2)+'px;background:linear-gradient(180deg,#4ADE9C,rgba(74,222,156,.25))" title="'+x.count+' inscriptions le '+x.date+'"></div><span class="bar-chart__lbl">'+lbl+'</span></div>';
  }).join('');

  var maxPage=c.top_pages&&c.top_pages[0]?c.top_pages[0].count:1;
  var topPagesHtml=(c.top_pages||[]).map(function(p){
    var pct=Math.round((p.count/maxPage)*100);
    return '<div class="page-row"><span class="page-row__name">'+p.page+'</span><div class="page-row__bar-wrap"><div class="page-row__bar" style="width:'+pct+'%"></div></div><span class="page-row__count">'+p.count+'</span></div>';
  }).join('')||'<span style="color:var(--text-muted);font-size:13px">Pas encore de données (tracker actif dès maintenant)</span>';

  var recentUsersHtml=(u.recent||[]).map(function(usr){
    return '<tr><td>'+esc(usr.email||'—')+'</td><td>'+(usr.is_pro?'<span class="badge-pro">PRO</span>':'<span class="badge-free">Gratuit</span>')+'</td><td>'+fmtDate(usr.created_at)+'</td></tr>';
  }).join('')||'<tr><td colspan="3" style="color:var(--text-muted)">Aucun utilisateur</td></tr>';

  document.getElementById('panelStats').innerHTML=
    '<div class="kpi-grid">'
      +'<div class="kpi"><div class="kpi__label">Visites aujourd\'hui</div><div class="kpi__val kpi--accent">'+t.views_today+'</div><div class="kpi__sub">'+t.sessions_today+' sessions uniques</div></div>'
      +'<div class="kpi"><div class="kpi__label">Visites 7 jours</div><div class="kpi__val">'+t.views_7d+'</div><div class="kpi__sub">'+t.sessions_7d+' sessions uniques</div></div>'
      +'<div class="kpi"><div class="kpi__label">Visites 30 jours</div><div class="kpi__val">'+t.views_30d+'</div><div class="kpi__sub">&nbsp;</div></div>'
      +'<div class="kpi"><div class="kpi__label">Durée moy. session</div><div class="kpi__val">'+fmtDur(t.avg_duration_s)+'</div><div class="kpi__sub">30 derniers jours</div></div>'
      +'<div class="kpi kpi--bull"><div class="kpi__label">Utilisateurs total</div><div class="kpi__val">'+u.total+'</div><div class="kpi__sub">&nbsp;</div></div>'
      +'<div class="kpi kpi--accent"><div class="kpi__label">Comptes PRO</div><div class="kpi__val">'+u.pro+'</div><div class="kpi__sub">'+(u.total?Math.round(u.pro/u.total*100):0)+'% des membres</div></div>'
      +'<div class="kpi"><div class="kpi__label">Comptes gratuits</div><div class="kpi__val">'+u.free+'</div><div class="kpi__sub">&nbsp;</div></div>'
      +'<div class="kpi kpi--warn"><div class="kpi__label">Avis en attente</div><div class="kpi__val">'+co.reviews_pending+'</div><div class="kpi__sub">'+co.reviews_published+' publiés</div></div>'
    +'</div>'

    +'<div class="charts-row">'
      +'<div class="chart-box"><h3>Visites par jour — 14 jours</h3><div class="bar-chart">'+barsViews+'</div></div>'
      +'<div class="chart-box"><h3>Inscriptions par jour — 14 jours</h3><div class="bar-chart">'+barsSignups+'</div></div>'
    +'</div>'

    +'<div class="charts-row">'
      +'<div class="chart-box"><h3>Pages les plus visitées — 30 jours</h3><div class="pages-list">'+topPagesHtml+'</div></div>'
      +'<div class="tbl-box" style="margin-bottom:0"><h3>Derniers inscrits</h3><table><thead><tr><th>Email</th><th>Statut</th><th>Inscription</th></tr></thead><tbody>'+recentUsersHtml+'</tbody></table></div>'
    +'</div>';
}

// ── REVIEWS ──
function stars(n){var s='';for(var i=0;i<5;i++){s+='<svg viewBox="0 0 24 24" width="13" height="13" style="opacity:'+(i<n?1:.2)+'"><path d="M12 2l2.95 6.18 6.8.62-5.13 4.5 1.54 6.65L12 17.1 5.84 20.45l1.54-6.65L2.25 8.8l6.8-.62z" fill="currentColor"/></svg>';}return s;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function frDate(iso){try{return new Date(iso).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}

function loadReviews(){
  fetch(REVIEWS_API+'?all=1',{headers:{'X-Admin-Pass':ADMIN_PASS}})
  .then(function(r){return r.json();})
  .then(function(d){
    reviewData.pending=(d.reviews||[]).filter(function(r){return !r.approved;});
    reviewData.approved=(d.reviews||[]).filter(function(r){return r.approved;});
    var badge=document.getElementById('badgePending');
    if(reviewData.pending.length>0){badge.textContent=reviewData.pending.length;badge.style.display='';}
    else{badge.style.display='none';}
    renderReviews('pending');
    renderReviews('approved');
  })
  .catch(function(){});
}

function renderReviews(tab){
  var rows=reviewData[tab];
  var panelId='panel'+tab.charAt(0).toUpperCase()+tab.slice(1);
  var area=document.getElementById(panelId);
  if(!rows.length){
    area.innerHTML='<div class="adm-empty">'+(tab==='pending'?'Aucun avis en attente.':'Aucun avis publié.')+'</div>';
    return;
  }
  area.innerHTML='<div style="margin-bottom:12px;color:var(--text-muted);font-size:12px">'+rows.length+' avis</div><div class="adm-grid">'+rows.map(function(rv){
    return '<div class="adm-card">'
      +'<div>'
      +'<div class="adm-card__meta">'
      +'<span class="adm-card__name">'+esc(rv.author_name)+'</span>'
      +(rv.role?'<span class="adm-card__role">'+esc(rv.role)+'</span>':'')
      +'<span class="adm-card__stars">'+stars(rv.rating)+'</span>'
      +'<span class="adm-card__date">'+frDate(rv.created_at)+'</span>'
      +'</div>'
      +(rv.user_email?'<div class="adm-card__email">'+esc(rv.user_email)+'</div>':'')
      +'<div class="adm-card__body">'+esc(rv.body)+'</div>'
      +'</div>'
      +'<div class="adm-card__actions">'
      +(tab==='pending'
        ?'<button class="btn-approve" onclick="approveRv(\''+rv.id+'\')">Approuver</button>'
        :'<button class="btn-unapprove" onclick="unapproveRv(\''+rv.id+'\')">Retirer</button>')
      +'<button class="btn-delete" onclick="deleteRv(\''+rv.id+'\')">Supprimer</button>'
      +'</div>'
      +'</div>';
  }).join('')+'</div>';
}

function approveRv(id){
  if(!confirm('Publier cet avis ?'))return;
  fetch(REVIEWS_API,{method:'PATCH',headers:{'Content-Type':'application/json','X-Admin-Pass':ADMIN_PASS},body:JSON.stringify({id:id,approved:true})})
  .then(function(r){return r.json();}).then(function(d){if(d.ok)loadReviews();});
}
function unapproveRv(id){
  if(!confirm('Retirer cet avis ?'))return;
  fetch(REVIEWS_API,{method:'PATCH',headers:{'Content-Type':'application/json','X-Admin-Pass':ADMIN_PASS},body:JSON.stringify({id:id,approved:false})})
  .then(function(r){return r.json();}).then(function(d){if(d.ok)loadReviews();});
}
function deleteRv(id){
  if(!confirm('Supprimer définitivement ?'))return;
  fetch(REVIEWS_API,{method:'DELETE',headers:{'Content-Type':'application/json','X-Admin-Pass':ADMIN_PASS},body:JSON.stringify({id:id})})
  .then(function(r){return r.json();}).then(function(d){if(d.ok)loadReviews();});
}
</script>
</body>
</html>
