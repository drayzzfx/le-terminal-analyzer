<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Terminal — Admin</title>
<link rel="stylesheet" href="./fonts.css">
<link rel="stylesheet" href="./design-system.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07090C;color:#C3CAD4;font-family:'Inter',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── AUTH GATE ── */
#authGate{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(127,184,232,.06) 0%,transparent 70%)}
.ag-box{background:#0E1219;border:1px solid #1C212A;border-radius:10px;padding:44px 36px;width:100%;max-width:380px;text-align:center}
.ag-logo{font-family:'Anton',sans-serif;font-size:26px;text-transform:uppercase;letter-spacing:.08em;background:linear-gradient(180deg,#FBFCFE 0%,#8A929E 50%,#B7BEC9 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.ag-sub{font-size:12px;color:#7E8794;letter-spacing:.06em;text-transform:uppercase;margin-bottom:28px}
.ag-in{width:100%;background:#161B24;border:1px solid #1C212A;border-radius:6px;padding:11px 14px;color:#F2F4F7;font-family:'Inter',sans-serif;font-size:14px;outline:none;margin-bottom:10px;transition:border-color .15s}
.ag-in:focus{border-color:#7FB8E8}
.ag-btn{width:100%;padding:12px;background:#7FB8E8;border:none;border-radius:6px;color:#07090C;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
.ag-btn:hover{background:#BFDCF5}
.ag-err{font-size:12px;color:#F0647A;margin-top:8px;min-height:18px}

/* ── LAYOUT ── */
#admin{display:none;min-height:100vh}
.adm-nav{background:#0B0E13;border-bottom:1px solid #1C212A;padding:0 24px;display:flex;align-items:center;gap:0;position:sticky;top:0;z-index:100}
.adm-nav-logo{font-family:'Anton',sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:.1em;color:#F2F4F7;margin-right:24px;white-space:nowrap;padding:14px 0}
.adm-tab{padding:16px 16px;border:none;border-bottom:2px solid transparent;background:transparent;color:#7E8794;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.adm-tab.active{color:#7FB8E8;border-bottom-color:#7FB8E8}
.adm-tab:hover:not(.active){color:#F2F4F7}
.adm-badge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;border-radius:99px;background:#F0647A;color:#fff;font-size:10px;font-weight:700;padding:0 4px;margin-left:5px}
.adm-body{padding:24px 24px 80px;max-width:1440px;margin:0 auto}

/* ── LIVE BAR ── */
.live-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding:10px 14px;background:#0E1219;border:1px solid #1C212A;border-radius:8px}
.live-dot{width:8px;height:8px;border-radius:50%;background:#4ADE9C;flex-shrink:0;animation:livepulse 2s infinite}
@keyframes livepulse{0%,100%{box-shadow:0 0 0 0 rgba(74,222,156,.6)}50%{box-shadow:0 0 0 5px rgba(74,222,156,0)}}
.live-label{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:#4ADE9C;text-transform:uppercase;letter-spacing:.1em}
.live-sep{color:#1C212A}
.live-upd{font-family:'JetBrains Mono',monospace;font-size:11px;color:#7E8794}
.live-countdown{font-family:'JetBrains Mono',monospace;font-size:11px;color:#7E8794;margin-left:auto}
.live-refreshbtn{padding:5px 12px;background:transparent;border:1px solid #1C212A;border-radius:4px;color:#7E8794;font-size:11px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s;white-space:nowrap}
.live-refreshbtn:hover{border-color:#7FB8E8;color:#7FB8E8}

/* ── KPI GRID ── */
.kpi-row{display:grid;gap:10px;margin-bottom:10px}
.kpi-row--4{grid-template-columns:repeat(4,1fr)}
.kpi-row--4b{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.kpi-row--4,.kpi-row--4b{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.kpi-row--4,.kpi-row--4b{grid-template-columns:1fr 1fr}}

.kpi{background:#0E1219;border:1px solid #1C212A;border-radius:10px;padding:18px 20px;position:relative;overflow:hidden;transition:border-color .2s}
.kpi:hover{border-color:#3A414C}
.kpi__top-bar{position:absolute;top:0;left:0;right:0;height:2px}
.kpi--accent .kpi__top-bar{background:linear-gradient(90deg,#7FB8E8,rgba(127,184,232,0))}
.kpi--bull .kpi__top-bar{background:linear-gradient(90deg,#4ADE9C,rgba(74,222,156,0))}
.kpi--bear .kpi__top-bar{background:linear-gradient(90deg,#F0647A,rgba(240,100,122,0))}
.kpi--warn .kpi__top-bar{background:linear-gradient(90deg,#E8C268,rgba(232,194,104,0))}
.kpi--live .kpi__top-bar{background:linear-gradient(90deg,#4ADE9C,rgba(74,222,156,0))}
.kpi__label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#7E8794;margin-bottom:8px}
.kpi__val{font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:700;line-height:1;margin-bottom:5px;color:#F2F4F7}
.kpi--accent .kpi__val{color:#7FB8E8}
.kpi--bull .kpi__val{color:#4ADE9C}
.kpi--bear .kpi__val{color:#F0647A}
.kpi--warn .kpi__val{color:#E8C268}
.kpi--live .kpi__val{color:#4ADE9C}
.kpi__sub{font-size:11px;color:#7E8794}
.kpi__live-badge{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#4ADE9C;font-weight:600}
.kpi__live-badge-dot{width:6px;height:6px;border-radius:50%;background:#4ADE9C;animation:livepulse 2s infinite}

/* ── CHARTS LAYOUT ── */
.charts-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.charts-3{display:grid;grid-template-columns:3fr 2fr;gap:10px;margin-bottom:10px}
.charts-feed{display:grid;grid-template-columns:3fr 2fr;gap:10px;margin-bottom:10px}
@media(max-width:900px){.charts-2,.charts-3,.charts-feed{grid-template-columns:1fr}}

.chart-box{background:#0E1219;border:1px solid #1C212A;border-radius:10px;padding:20px 20px 16px}
.chart-box__title{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#7E8794;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.chart-box__title span{font-family:'JetBrains Mono',monospace;font-size:12px;color:#F2F4F7;font-weight:600}
.chart-wrap{width:100%;overflow:hidden}

/* ── TOP PAGES ── */
.pages-list{display:flex;flex-direction:column;gap:8px}
.page-row{display:flex;align-items:center;gap:10px}
.page-rank{font-family:'JetBrains Mono',monospace;font-size:10px;color:#7E8794;width:16px;flex-shrink:0;text-align:right}
.page-name{font-family:'JetBrains Mono',monospace;font-size:12px;color:#C3CAD4;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page-bar-wrap{width:80px;height:4px;background:#161B24;border-radius:99px;overflow:hidden;flex-shrink:0}
.page-bar{height:100%;border-radius:99px;background:#7FB8E8;transition:width .4s}
.page-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:#7E8794;width:28px;text-align:right;flex-shrink:0}

/* ── LIVE FEED ── */
.feed-list{display:flex;flex-direction:column;gap:1px;max-height:380px;overflow-y:auto}
.feed-list::-webkit-scrollbar{width:4px}
.feed-list::-webkit-scrollbar-track{background:transparent}
.feed-list::-webkit-scrollbar-thumb{background:#1C212A;border-radius:99px}
.feed-item{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:6px;transition:background .15s}
.feed-item:hover{background:#0B0E13}
.feed-item--new{background:rgba(74,222,156,.04)}
.feed-item__time{font-family:'JetBrains Mono',monospace;font-size:10px;color:#7E8794;white-space:nowrap;min-width:64px}
.feed-item__mid{min-width:0}
.feed-item__page{font-family:'JetBrains Mono',monospace;font-size:12px;color:#C3CAD4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed-item__email{font-size:11px;color:#7E8794;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.feed-item__right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.feed-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.feed-dot--pv{background:#7FB8E8}
.feed-dot--se{background:#7E8794}
.feed-device{color:#7E8794}
.feed-empty{text-align:center;padding:40px 16px;color:#7E8794;font-size:13px}

/* ── USERS TABLE ── */
.tbl-box{background:#0E1219;border:1px solid #1C212A;border-radius:10px;padding:18px 20px}
.tbl-box__title{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#7E8794;margin-bottom:14px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:6px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#7E8794;border-bottom:1px solid #1C212A}
.tbl td{padding:8px 8px;border-bottom:1px solid #0B0E13;color:#C3CAD4;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(255,255,255,.015)}
.badge-pro{display:inline-block;padding:2px 7px;border-radius:4px;background:rgba(74,222,156,.1);border:1px solid rgba(74,222,156,.25);color:#4ADE9C;font-size:10px;font-weight:600}
.badge-free{display:inline-block;padding:2px 7px;border-radius:4px;background:#0B0E13;border:1px solid #1C212A;color:#7E8794;font-size:10px}

/* ── REVIEWS ── */
.adm-grid{display:flex;flex-direction:column;gap:10px}
.adm-card{background:#0E1219;border:1px solid #1C212A;border-radius:10px;padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start;transition:border-color .15s}
.adm-card:hover{border-color:#3A414C}
.adm-card__meta{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.adm-card__name{font-weight:600;font-size:14px;color:#F2F4F7}
.adm-card__role{font-size:11px;color:#7E8794;background:#161B24;padding:2px 7px;border-radius:4px}
.adm-card__stars{display:flex;gap:2px;color:#E8C268}
.adm-card__date{font-family:'JetBrains Mono',monospace;font-size:10px;color:#7E8794;margin-left:auto}
.adm-card__email{font-family:'JetBrains Mono',monospace;font-size:11px;color:#7E8794;margin-bottom:8px}
.adm-card__body{font-size:13.5px;color:#C3CAD4;line-height:1.65}
.adm-card__actions{display:flex;flex-direction:column;gap:7px;min-width:108px}
.btn-approve{padding:7px 12px;background:rgba(74,222,156,.08);border:1px solid rgba(74,222,156,.25);border-radius:5px;color:#4ADE9C;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;width:100%;transition:background .15s}
.btn-approve:hover{background:rgba(74,222,156,.18)}
.btn-delete{padding:7px 12px;background:rgba(240,100,122,.06);border:1px solid rgba(240,100,122,.2);border-radius:5px;color:#F0647A;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;width:100%;transition:background .15s}
.btn-delete:hover{background:rgba(240,100,122,.14)}
.btn-unapprove{padding:7px 12px;background:rgba(232,194,104,.06);border:1px solid rgba(232,194,104,.2);border-radius:5px;color:#E8C268;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;width:100%;transition:background .15s}
.btn-unapprove:hover{background:rgba(232,194,104,.14)}
.adm-empty{text-align:center;padding:64px 24px;color:#7E8794;font-size:14px}
.adm-loader{text-align:center;padding:48px;color:#7E8794;font-size:13px}
.adm-count{font-size:12px;color:#7E8794;margin-bottom:12px}

/* ── SECTION DIVIDERS ── */
.section-gap{margin-bottom:10px}
</style>
</head>
<body>

<!-- AUTH -->
<div id="authGate">
  <div class="ag-box">
    <div class="ag-logo">Le Terminal</div>
    <div class="ag-sub">Administration — accès restreint</div>
    <input class="ag-in" id="agPass" type="password" placeholder="Mot de passe admin" autocomplete="current-password">
    <button class="ag-btn" id="agBtn">Accéder</button>
    <div class="ag-err" id="agErr"></div>
  </div>
</div>

<!-- ADMIN -->
<div id="admin">
  <nav class="adm-nav">
    <span class="adm-nav-logo">Admin</span>
    <button class="adm-tab active" id="tabStats"   onclick="showTab('stats')">Statistiques</button>
    <button class="adm-tab"        id="tabPending" onclick="showTab('pending')">En attente <span id="badgePending" class="adm-badge" style="display:none"></span></button>
    <button class="adm-tab"        id="tabApproved"onclick="showTab('approved')">Publiés</button>
  </nav>
  <div class="adm-body">
    <div id="panelStats"></div>
    <div id="panelPending"  style="display:none"></div>
    <div id="panelApproved" style="display:none"></div>
  </div>
</div>

<script>
var ADMIN_PASS  = 'leterminal-admin-2026';
var STATS_API   = '/api/admin-stats';
var REVIEWS_API = '/api/admin-reviews';
var curTab      = 'stats';
var reviewData  = { pending: [], approved: [] };
var refreshTimer, refreshCountdown, countdownInterval;
var REFRESH_INTERVAL = 30; // seconds
var svgCtr = 0;
var lastStatsData = null;

// ── Auth ──────────────────────────────────────────────
document.getElementById('agBtn').onclick = function() {
  var p = document.getElementById('agPass').value.trim();
  if (p !== ADMIN_PASS) { document.getElementById('agErr').textContent = 'Mot de passe incorrect.'; return; }
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('admin').style.display = 'block';
  loadAll();
  startAutoRefresh();
};
document.getElementById('agPass').onkeydown = function(e) { if (e.key === 'Enter') document.getElementById('agBtn').click(); };

function showTab(tab) {
  curTab = tab;
  ['stats','pending','approved'].forEach(function(t) {
    var T = t.charAt(0).toUpperCase() + t.slice(1);
    document.getElementById('tab'+T).className = 'adm-tab' + (t===tab?' active':'');
    document.getElementById('panel'+T).style.display = t===tab ? '' : 'none';
  });
}

function loadAll() { loadStats(); loadReviews(); }

// ── Auto-refresh ──────────────────────────────────────
function startAutoRefresh() {
  clearTimeout(refreshTimer);
  clearInterval(countdownInterval);
  refreshCountdown = REFRESH_INTERVAL;
  updateCountdown();
  countdownInterval = setInterval(function() {
    refreshCountdown--;
    updateCountdown();
    if (refreshCountdown <= 0) {
      refreshCountdown = REFRESH_INTERVAL;
      loadStats();
    }
  }, 1000);
}

function updateCountdown() {
  var el = document.getElementById('liveCountdown');
  if (el) el.textContent = 'Actualisation dans ' + refreshCountdown + 's';
}

function manualRefresh() {
  refreshCountdown = REFRESH_INTERVAL;
  loadStats();
}

// ── Helpers ───────────────────────────────────────────
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDur(s) {
  if (!s) return '—';
  if (s < 60) return s + 's';
  return Math.floor(s/60) + 'm ' + (s%60) + 's';
}
function fmtDate(iso) {
  try { return new Date(iso).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}); }
  catch(e) { return ''; }
}
function relTime(iso) {
  if (!iso) return '—';
  var diff = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (diff < 5)   return 'maintenant';
  if (diff < 60)  return 'il y a ' + diff + 's';
  if (diff < 3600)return 'il y a ' + Math.floor(diff/60) + 'min';
  return 'il y a ' + Math.floor(diff/3600) + 'h';
}
function isMobile(ua) {
  return ua && /Mobile|Android|iPhone/i.test(ua);
}
function deviceSvg(ua) {
  if (isMobile(ua)) {
    return '<svg class="feed-device" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="2" width="14" height="20" rx="2"/><circle cx="12" cy="17.5" r=".8" fill="currentColor" stroke="none"/></svg>';
  }
  return '<svg class="feed-device" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="13" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg>';
}
function stars(n) {
  var s = '';
  for (var i = 0; i < 5; i++) {
    s += '<svg viewBox="0 0 24 24" width="12" height="12" style="opacity:'+(i<n?1:.18)+'"><path d="M12 2l2.95 6.18 6.8.62-5.13 4.5 1.54 6.65L12 17.1 5.84 20.45l1.54-6.65L2.25 8.8l6.8-.62z" fill="currentColor"/></svg>';
  }
  return s;
}
function frDate(iso) {
  try { return new Date(iso).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch(e) { return ''; }
}

// ── SVG Charts ────────────────────────────────────────
function svgLine(data, color, h) {
  h = h || 110;
  var W = 600, padL = 4, padR = 4, padT = 12, padB = 22;
  var pw = W - padL - padR, ph = h - padT - padB;
  var counts = data.map(function(d){ return d.count || 0; });
  var max = Math.max.apply(null, counts) || 1;
  var n = data.length;
  if (n < 2) return '<text x="300" y="55" fill="#3A414C" font-size="12" text-anchor="middle" font-family="Inter,sans-serif">Pas encore de données</text>';
  var pts = data.map(function(d, i) {
    return [padL + (i/(n-1))*pw, padT + ph - ((d.count||0)/max)*ph];
  });
  // Smooth bezier
  var path = pts.reduce(function(acc, p, i) {
    if (i === 0) return 'M'+p[0].toFixed(1)+','+p[1].toFixed(1);
    var prev = pts[i-1];
    var cx = ((prev[0]+p[0])/2).toFixed(1);
    return acc+' C'+cx+','+prev[1].toFixed(1)+' '+cx+','+p[1].toFixed(1)+' '+p[0].toFixed(1)+','+p[1].toFixed(1);
  }, '');
  var area = path + ' L'+pts[n-1][0].toFixed(1)+','+(padT+ph)+' L'+pts[0][0].toFixed(1)+','+(padT+ph)+' Z';
  // Grid lines (3 horizontal)
  var grid = [0, 0.5, 1].map(function(f) {
    var y = (padT + ph - f*ph).toFixed(1);
    return '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>';
  }).join('');
  // X labels (every 2nd point)
  var labels = data.map(function(d, i) {
    if (i % 2 !== 0) return '';
    var x = pts[i][0].toFixed(1);
    var lbl = d.date ? d.date.slice(5) : (d.hour !== undefined ? d.hour+'h' : '');
    return '<text x="'+x+'" y="'+(h-5)+'" fill="rgba(255,255,255,0.22)" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">'+lbl+'</text>';
  }).join('');
  // Dots with tooltip
  var dots = pts.map(function(p, i) {
    var d = data[i];
    var lbl = d.date || (d.hour !== undefined ? d.hour+'h' : '');
    return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.8" fill="'+color+'" stroke="#0E1219" stroke-width="1.5"><title>'+d.count+' — '+lbl+'</title></circle>';
  }).join('');
  var gid = 'g'+(++svgCtr);
  return '<svg viewBox="0 0 '+W+' '+h+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block">'
    +'<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0%" stop-color="'+color+'" stop-opacity="0.22"/>'
    +'<stop offset="100%" stop-color="'+color+'" stop-opacity="0"/>'
    +'</linearGradient></defs>'
    +grid
    +'<path d="'+area+'" fill="url(#'+gid+')"/>'
    +'<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
    +dots+labels
    +'</svg>';
}

function svgHourBar(data) {
  var W = 600, H = 72;
  var counts = data.map(function(d){ return d.count||0; });
  var max = Math.max.apply(null, counts) || 1;
  var barW = W / 24;
  var bars = data.map(function(d, i) {
    var bh = Math.max((d.count/max)*52, 2);
    var x = (i * barW + 1).toFixed(1);
    var y = (60 - bh).toFixed(1);
    var op = (0.3 + (d.count/max)*0.7).toFixed(2);
    var color = d.count > 0 ? '#7FB8E8' : '#1C212A';
    var lbl = (i % 4 === 0) ? '<text x="'+(i*barW+barW/2).toFixed(1)+'" y="70" fill="rgba(255,255,255,0.22)" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">'+i+'h</text>' : '';
    return '<rect x="'+x+'" y="'+y+'" width="'+(barW-2).toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="'+color+'" opacity="'+op+'" rx="1"><title>'+d.count+' visites à '+i+'h</title></rect>'+lbl;
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block">'+bars+'</svg>';
}

// ── Render Stats ──────────────────────────────────────
function loadStats() {
  if (!document.getElementById('liveUpdated')) {
    document.getElementById('panelStats').innerHTML = '<div class="adm-loader">Chargement…</div>';
  }
  fetch(STATS_API, { headers: { 'X-Admin-Pass': ADMIN_PASS } })
    .then(function(r){ return r.json(); })
    .then(function(d){ lastStatsData = d; renderStats(d); })
    .catch(function(){ if (!lastStatsData) document.getElementById('panelStats').innerHTML = '<div class="adm-empty">Erreur de chargement.</div>'; });
}

function renderStats(d) {
  var u  = d.users   || {};
  var t  = d.traffic || {};
  var c  = d.charts  || {};
  var co = d.content || {};
  var lv = d.live    || {};

  var now = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  // Live bar
  var liveBar = '<div class="live-bar">'
    +'<span class="live-dot"></span>'
    +'<span class="live-label">Live</span>'
    +'<span class="live-sep">|</span>'
    +'<span class="live-upd" id="liveUpdated">Actualisé à '+now+'</span>'
    +'<span class="live-countdown" id="liveCountdown">Actualisation dans '+refreshCountdown+'s</span>'
    +'<button class="live-refreshbtn" onclick="manualRefresh()">Actualiser</button>'
    +'</div>';

  // KPI row 1: Active now, Today, Users, PRO
  var kpiRow1 = '<div class="kpi-row kpi-row--4" style="margin-bottom:10px">'
    +'<div class="kpi kpi--live"><div class="kpi__top-bar"></div>'
    +'<div class="kpi__live-badge"><span class="kpi__live-badge-dot"></span>EN DIRECT</div>'
    +'<div class="kpi__label">Actifs maintenant</div>'
    +'<div class="kpi__val">'+(t.active_now||0)+'</div>'
    +'<div class="kpi__sub">dernières 5 minutes</div></div>'

    +'<div class="kpi kpi--accent"><div class="kpi__top-bar"></div>'
    +'<div class="kpi__label">Visites aujourd\'hui</div>'
    +'<div class="kpi__val">'+(t.views_today||0)+'</div>'
    +'<div class="kpi__sub">'+(t.sessions_today||0)+' sessions uniques</div></div>'

    +'<div class="kpi kpi--bull"><div class="kpi__top-bar"></div>'
    +'<div class="kpi__label">Utilisateurs total</div>'
    +'<div class="kpi__val">'+(u.total||0)+'</div>'
    +'<div class="kpi__sub">'+(u.total ? Math.round((u.pro||0)/(u.total)*100) : 0)+'% PRO</div></div>'

    +'<div class="kpi kpi--accent"><div class="kpi__top-bar"></div>'
    +'<div class="kpi__label">Comptes PRO</div>'
    +'<div class="kpi__val">'+(u.pro||0)+'</div>'
    +'<div class="kpi__sub">'+(u.free||0)+' comptes gratuits</div></div>'
    +'</div>';

  // KPI row 2: 7j, 30j, Duration, Reviews
  var kpiRow2 = '<div class="kpi-row kpi-row--4b" style="margin-bottom:20px">'
    +'<div class="kpi"><div class="kpi__top-bar" style="background:linear-gradient(90deg,#7FB8E8,transparent)"></div>'
    +'<div class="kpi__label">Visites 7 jours</div>'
    +'<div class="kpi__val" style="font-size:28px">'+(t.views_7d||0)+'</div>'
    +'<div class="kpi__sub">'+(t.sessions_7d||0)+' sessions</div></div>'

    +'<div class="kpi"><div class="kpi__top-bar" style="background:linear-gradient(90deg,#7FB8E8,transparent)"></div>'
    +'<div class="kpi__label">Visites 30 jours</div>'
    +'<div class="kpi__val" style="font-size:28px">'+(t.views_30d||0)+'</div>'
    +'<div class="kpi__sub">&nbsp;</div></div>'

    +'<div class="kpi"><div class="kpi__top-bar" style="background:linear-gradient(90deg,#E8C268,transparent)"></div>'
    +'<div class="kpi__label">Durée moy. session</div>'
    +'<div class="kpi__val" style="font-size:28px;color:#E8C268">'+fmtDur(t.avg_duration_s)+'</div>'
    +'<div class="kpi__sub">30 derniers jours</div></div>'

    +'<div class="kpi kpi--warn"><div class="kpi__top-bar"></div>'
    +'<div class="kpi__label">Avis en attente</div>'
    +'<div class="kpi__val" style="font-size:28px">'+(co.reviews_pending||0)+'</div>'
    +'<div class="kpi__sub">'+(co.reviews_published||0)+' publiés</div></div>'
    +'</div>';

  // Charts row 1: daily views + daily signups
  var chartViews   = svgLine(c.daily_views   || [], '#7FB8E8');
  var chartSignups = svgLine(c.daily_signups || [], '#4ADE9C');
  var charts1 = '<div class="charts-2">'
    +'<div class="chart-box"><div class="chart-box__title">Visites par jour — 14 jours <span>'+((c.daily_views||[]).reduce(function(a,x){return a+x.count;},0))+'</span></div><div class="chart-wrap">'+chartViews+'</div></div>'
    +'<div class="chart-box"><div class="chart-box__title">Inscriptions par jour — 14 jours <span>'+((c.daily_signups||[]).reduce(function(a,x){return a+x.count;},0))+'</span></div><div class="chart-wrap">'+chartSignups+'</div></div>'
    +'</div>';

  // Charts row 2: hourly + top pages
  var chartHour = svgHourBar(c.hourly || []);
  var maxPage = (c.top_pages && c.top_pages[0]) ? c.top_pages[0].count : 1;
  var topPagesHtml = (c.top_pages || []).map(function(p, i) {
    var pct = Math.round((p.count/maxPage)*100);
    return '<div class="page-row">'
      +'<span class="page-rank">'+(i+1)+'</span>'
      +'<span class="page-name">'+esc(p.page)+'</span>'
      +'<div class="page-bar-wrap"><div class="page-bar" style="width:'+pct+'%"></div></div>'
      +'<span class="page-count">'+p.count+'</span>'
      +'</div>';
  }).join('') || '<div style="color:#7E8794;font-size:12px;padding:16px 0">Aucune donnée — le tracker collecte dès maintenant.</div>';

  var charts2 = '<div class="charts-2" style="margin-bottom:10px">'
    +'<div class="chart-box"><div class="chart-box__title">Heures de pointe — 7 jours</div><div class="chart-wrap">'+chartHour+'</div></div>'
    +'<div class="chart-box"><div class="chart-box__title">Pages les plus visitées — 30 jours</div><div class="pages-list">'+topPagesHtml+'</div></div>'
    +'</div>';

  // Live feed + recent users
  var feedItems = '';
  var evts = (lv.events || []).filter(function(e){ return e.event_type === 'pageview'; });
  if (evts.length === 0) {
    feedItems = '<div class="feed-empty">Aucune visite enregistrée pour l\'instant.</div>';
  } else {
    feedItems = evts.slice(0, 40).map(function(e, i) {
      var mobile = isMobile(e.ua);
      var newCls = i < 3 ? ' feed-item--new' : '';
      return '<div class="feed-item'+newCls+'">'
        +'<span class="feed-item__time">'+relTime(e.created_at)+'</span>'
        +'<div class="feed-item__mid">'
          +'<div class="feed-item__page">'+(e.page || 'index')+'</div>'
          +'<div class="feed-item__email">'+(e.user_email ? esc(e.user_email) : 'Visiteur anonyme')+(e.session_id ? ' · #'+e.session_id : '')+'</div>'
        +'</div>'
        +'<div class="feed-item__right">'
          +'<span class="feed-dot feed-dot--pv"></span>'
          +deviceSvg(e.ua)
        +'</div>'
        +'</div>';
    }).join('');
  }

  var recentUsersHtml = (u.recent || []).map(function(usr) {
    return '<tr>'
      +'<td style="font-family:\'JetBrains Mono\',monospace;font-size:11px">'+esc(usr.email||'—')+'</td>'
      +'<td>'+(usr.is_pro?'<span class="badge-pro">PRO</span>':'<span class="badge-free">Gratuit</span>')+'</td>'
      +'<td style="font-family:\'JetBrains Mono\',monospace;font-size:11px;color:#7E8794">'+fmtDate(usr.created_at)+'</td>'
      +'</tr>';
  }).join('') || '<tr><td colspan="3" style="color:#7E8794;padding:16px 8px">Aucun utilisateur</td></tr>';

  var feedAndUsers = '<div class="charts-feed">'
    +'<div class="chart-box" style="padding:18px 16px">'
      +'<div class="chart-box__title">Flux de connexions en temps réel <span>'+(evts.length||0)+'</span></div>'
      +'<div class="feed-list">'+feedItems+'</div>'
    +'</div>'
    +'<div class="tbl-box">'
      +'<div class="tbl-box__title">Derniers inscrits</div>'
      +'<table class="tbl"><thead><tr><th>Email</th><th>Statut</th><th>Inscription</th></tr></thead>'
      +'<tbody>'+recentUsersHtml+'</tbody></table>'
    +'</div>'
    +'</div>';

  document.getElementById('panelStats').innerHTML = liveBar + kpiRow1 + kpiRow2 + charts1 + charts2 + feedAndUsers;
}

// ── Reviews ───────────────────────────────────────────
function loadReviews() {
  fetch(REVIEWS_API + '?all=1', { headers: { 'X-Admin-Pass': ADMIN_PASS } })
    .then(function(r){ return r.json(); })
    .then(function(d) {
      reviewData.pending  = (d.reviews || []).filter(function(r){ return !r.approved; });
      reviewData.approved = (d.reviews || []).filter(function(r){ return  r.approved; });
      var badge = document.getElementById('badgePending');
      if (reviewData.pending.length > 0) { badge.textContent = reviewData.pending.length; badge.style.display = ''; }
      else badge.style.display = 'none';
      renderReviews('pending');
      renderReviews('approved');
    })
    .catch(function(){});
}

function renderReviews(tab) {
  var rows = reviewData[tab];
  var panelId = 'panel' + tab.charAt(0).toUpperCase() + tab.slice(1);
  var area = document.getElementById(panelId);
  if (!rows.length) {
    area.innerHTML = '<div class="adm-empty">'+(tab==='pending'?'Aucun avis en attente.':'Aucun avis publié.')+'</div>';
    return;
  }
  area.innerHTML = '<div class="adm-count">'+rows.length+' avis</div>'
    +'<div class="adm-grid">'+rows.map(function(rv) {
      return '<div class="adm-card">'
        +'<div>'
        +'<div class="adm-card__meta">'
          +'<span class="adm-card__name">'+esc(rv.author_name)+'</span>'
          +(rv.role ? '<span class="adm-card__role">'+esc(rv.role)+'</span>' : '')
          +'<span class="adm-card__stars">'+stars(rv.rating)+'</span>'
          +'<span class="adm-card__date">'+frDate(rv.created_at)+'</span>'
        +'</div>'
        +(rv.user_email ? '<div class="adm-card__email">'+esc(rv.user_email)+'</div>' : '')
        +'<div class="adm-card__body">'+esc(rv.body)+'</div>'
        +'</div>'
        +'<div class="adm-card__actions">'
          +(tab==='pending'
            ? '<button class="btn-approve" onclick="approveRv(\''+rv.id+'\')">Approuver</button>'
            : '<button class="btn-unapprove" onclick="unapproveRv(\''+rv.id+'\')">Retirer</button>')
          +'<button class="btn-delete" onclick="deleteRv(\''+rv.id+'\')">Supprimer</button>'
        +'</div>'
        +'</div>';
    }).join('')+'</div>';
}

function approveRv(id) {
  if (!confirm('Publier cet avis ?')) return;
  fetch(REVIEWS_API, { method:'PATCH', headers:{'Content-Type':'application/json','X-Admin-Pass':ADMIN_PASS}, body:JSON.stringify({id:id,approved:true}) })
    .then(function(r){ return r.json(); }).then(function(d){ if (d.ok) loadReviews(); });
}
function unapproveRv(id) {
  if (!confirm('Retirer cet avis de la publication ?')) return;
  fetch(REVIEWS_API, { method:'PATCH', headers:{'Content-Type':'application/json','X-Admin-Pass':ADMIN_PASS}, body:JSON.stringify({id:id,approved:false}) })
    .then(function(r){ return r.json(); }).then(function(d){ if (d.ok) loadReviews(); });
}
function deleteRv(id) {
  if (!confirm('Supprimer définitivement cet avis ?')) return;
  fetch(REVIEWS_API, { method:'DELETE', headers:{'Content-Type':'application/json','X-Admin-Pass':ADMIN_PASS}, body:JSON.stringify({id:id}) })
    .then(function(r){ return r.json(); }).then(function(d){ if (d.ok) loadReviews(); });
}
</script>
