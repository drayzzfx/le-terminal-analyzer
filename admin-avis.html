<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Terminal — Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="./fonts.css">
<style>
:root{
  --bg:#07090C; --panel:#0E1219; --panel2:#0B0E13; --line:#1B2029; --line2:#262C37;
  --txt:#C3CAD4; --title:#F2F4F7; --muted:#7E8794; --dim:#5A616C;
  --accent:#3B7DFF; --green:#4ADE9C; --red:#F0647A; --gold:#E8C268;
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#04060B;color:#C3CAD4;font-family:'Inter',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── AUTH GATE ── */
#authGate{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(59,125,255,.06) 0%,transparent 70%)}
.ag-box{background:#0E1219;border:1px solid #1C212A;border-radius:10px;padding:44px 36px;width:100%;max-width:380px;text-align:center}
.ag-logo{font-family:'Anton',sans-serif;font-size:26px;text-transform:uppercase;letter-spacing:.08em;background:linear-gradient(180deg,#FBFCFE 0%,#8A929E 50%,#B7BEC9 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.ag-sub{font-size:12px;color:#7E8794;letter-spacing:.06em;text-transform:uppercase;margin-bottom:28px}
.ag-in{width:100%;background:#101724;border:1px solid #1C212A;border-radius:6px;padding:11px 14px;color:#F2F4F7;font-family:'Inter',sans-serif;font-size:14px;outline:none;margin-bottom:10px;transition:border-color .15s}
.ag-in:focus{border-color:#3B7DFF}
.ag-btn{width:100%;padding:12px;background:#3B7DFF;border:none;border-radius:6px;color:#04060B;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
.ag-btn:hover{background:#8FBAFF}
.ag-err{font-size:12px;color:#F0647A;margin-top:8px;min-height:18px}

/* ── LAYOUT ── */
#admin{display:none;min-height:100vh}
.adm-nav{background:#070A11;border-bottom:1px solid #1C212A;padding:0 24px;display:flex;align-items:center;gap:0;position:sticky;top:0;z-index:100;flex-wrap:wrap}
.adm-nav-logo{font-family:'Anton',sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:.1em;color:#F2F4F7;margin-right:24px;white-space:nowrap;padding:14px 0}
.adm-tab{padding:16px 16px;border:none;border-bottom:2px solid transparent;background:transparent;color:#7E8794;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.adm-tab.active{color:#3B7DFF;border-bottom-color:#3B7DFF}
.adm-tab:hover:not(.active){color:#F2F4F7}
.adm-badge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;border-radius:99px;background:#F0647A;color:#fff;font-size:10px;font-weight:700;padding:0 4px;margin-left:5px}
.adm-nav-live{margin-left:auto;display:flex;align-items:center;gap:9px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#7E8794;padding:8px 0}
.adm-nav-dot{width:8px;height:8px;border-radius:50%;background:#4ADE9C;flex-shrink:0;animation:livepulse 2s infinite}
.adm-nav-dot.stale{background:#E8C268;animation:none}
.adm-nav-refresh{padding:6px 12px;background:transparent;border:1px solid #1C212A;border-radius:5px;color:#7E8794;font-size:11px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s;white-space:nowrap}
.adm-nav-refresh:hover{border-color:#3B7DFF;color:#3B7DFF}
.adm-body{padding:24px 24px 80px;max-width:1440px;margin:0 auto}

/* ── LIVE BAR ── */
.live-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding:10px 14px;background:#0E1219;border:1px solid #1C212A;border-radius:8px;flex-wrap:wrap}
.live-dot{width:8px;height:8px;border-radius:50%;background:#4ADE9C;flex-shrink:0;animation:livepulse 2s infinite}
@keyframes livepulse{0%,100%{box-shadow:0 0 0 0 rgba(74,222,156,.6)}50%{box-shadow:0 0 0 5px rgba(74,222,156,0)}}
.live-label{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:#4ADE9C;text-transform:uppercase;letter-spacing:.1em}
.live-sep{color:#1C212A}
.live-upd{font-family:'JetBrains Mono',monospace;font-size:11px;color:#7E8794}
.live-countdown{font-family:'JetBrains Mono',monospace;font-size:11px;color:#7E8794;margin-left:auto}
.live-refreshbtn{padding:5px 12px;background:transparent;border:1px solid #1C212A;border-radius:4px;color:#7E8794;font-size:11px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s;white-space:nowrap}
.live-refreshbtn:hover{border-color:#3B7DFF;color:#3B7DFF}

/* ── KPI GRID ── */
.kpi-row{display:grid;gap:10px;margin-bottom:10px}
.kpi-row--4,.kpi-row--4b{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.kpi-row--4,.kpi-row--4b{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.kpi-row--4,.kpi-row--4b{grid-template-columns:1fr 1fr}}
.kpi{background:#0E1219;border:1px solid #1C212A;border-radius:10px;padding:18px 20px;position:relative;overflow:hidden;transition:border-color .2s}
.kpi:hover{border-color:#3A414C}
.kpi__top-bar{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#3B7DFF,rgba(59,125,255,0))}
.kpi--accent .kpi__top-bar{background:linear-gradient(90deg,#3B7DFF,rgba(59,125,255,0))}
.kpi--bull .kpi__top-bar{background:linear-gradient(90deg,#4ADE9C,rgba(74,222,156,0))}
.kpi--bear .kpi__top-bar{background:linear-gradient(90deg,#F0647A,rgba(240,100,122,0))}
.kpi--warn .kpi__top-bar{background:linear-gradient(90deg,#E8C268,rgba(232,194,104,0))}
.kpi--live .kpi__top-bar{background:linear-gradient(90deg,#4ADE9C,rgba(74,222,156,0))}
.kpi__label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#7E8794;margin-bottom:8px}
.kpi__val{font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:700;line-height:1;margin-bottom:5px;color:#F2F4F7}
.kpi--accent .kpi__val{color:#3B7DFF}
.kpi--bull .kpi__val{color:#4ADE9C}
.kpi--bear .kpi__val{color:#F0647A}
.kpi--warn .kpi__val{color:#E8C268}
.kpi--live .kpi__val{color:#4ADE9C}
.kpi__sub{font-size:11px;color:#7E8794}
.kpi__live-badge{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#4ADE9C;font-weight:600}
.kpi__live-badge-dot{width:6px;height:6px;border-radius:50%;background:#4ADE9C;animation:livepulse 2s infinite}

/* ── CHARTS LAYOUT ── */
.charts-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.charts-3{display:grid;grid-template-columns:3fr 2fr;gap:10px;margin-bottom:10px}
@media(max-width:900px){.charts-2,.charts-3{grid-template-columns:1fr}}
.chart-box{background:#0E1219;border:1px solid #1C212A;border-radius:10px;padding:20px 20px 16px}
.chart-box__title{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#7E8794;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.chart-box__title span{font-family:'JetBrains Mono',monospace;font-size:12px;color:#F2F4F7;font-weight:600}
.chart-wrap{width:100%;overflow:hidden}

/* ── TOP PAGES ── */
.pages-list{display:flex;flex-direction:column;gap:8px}
.page-row{display:flex;align-items:center;gap:10px}
.page-rank{font-family:'JetBrains Mono',monospace;font-size:10px;color:#7E8794;width:16px;flex-shrink:0;text-align:right}
.page-name{font-family:'JetBrains Mono',monospace;font-size:12px;color:#C3CAD4;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page-bar-wrap{width:80px;height:4px;background:#101724;border-radius:99px;overflow:hidden;flex-shrink:0}
.page-bar{height:100%;border-radius:99px;background:#3B7DFF;transition:width .4s}
.page-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:#7E8794;width:28px;text-align:right;flex-shrink:0}

/* ── LIVE FEED ── */
.feed-list{display:flex;flex-direction:column;gap:1px;max-height:380px;overflow-y:auto}
.feed-list::-webkit-scrollbar{width:4px}
.feed-list::-webkit-scrollbar-track{background:transparent}
.feed-list::-webkit-scrollbar-thumb{background:#1C212A;border-radius:99px}
.feed-item{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:6px;transition:background .15s}
.feed-item:hover{background:#070A11}
.feed-item--new{background:rgba(74,222,156,.05)}
.feed-item__time{font-family:'JetBrains Mono',monospace;font-size:10px;color:#7E8794;white-space:nowrap;min-width:64px}
.feed-item__mid{min-width:0}
.feed-item__page{font-family:'JetBrains Mono',monospace;font-size:12px;color:#C3CAD4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed-item__email{font-size:11px;color:#7E8794;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.feed-item__right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.feed-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.feed-dot--pv{background:#3B7DFF}
.feed-device{color:#7E8794;display:flex}
.feed-empty{text-align:center;padding:40px 16px;color:#7E8794;font-size:13px;line-height:1.6}

/* ── USERS TABLE ── */
.tbl-box{background:#0E1219;border:1px solid #1C212A;border-radius:10px;padding:18px 20px}
.tbl-box__title{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#7E8794;margin-bottom:14px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:6px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#7E8794;border-bottom:1px solid #1C212A}
.tbl td{padding:8px 8px;border-bottom:1px solid #070A11;color:#C3CAD4;vertical-align:middle}
.tbl td.mono{font-family:'JetBrains Mono',monospace}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(255,255,255,.015)}
.tbl tr.is-new td{background:rgba(74,222,156,.05)}
.badge-pro{display:inline-block;padding:2px 7px;border-radius:4px;background:rgba(74,222,156,.1);border:1px solid rgba(74,222,156,.25);color:#4ADE9C;font-size:10px;font-weight:600}
.badge-free{display:inline-block;padding:2px 7px;border-radius:4px;background:#070A11;border:1px solid #1C212A;color:#7E8794;font-size:10px}

/* ── REVIEWS ── */
.adm-grid{display:flex;flex-direction:column;gap:10px}
.adm-card{background:#0E1219;border:1px solid #1C212A;border-radius:10px;padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start;transition:border-color .15s}
.adm-card:hover{border-color:#3A414C}
.adm-card__meta{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.adm-card__name{font-weight:600;font-size:14px;color:#F2F4F7}
.adm-card__role{font-size:11px;color:#7E8794;background:#101724;padding:2px 7px;border-radius:4px}
.adm-card__stars{display:flex;gap:2px;color:#E8C268}
.adm-card__date{font-family:'JetBrains Mono',monospace;font-size:10px;color:#7E8794;margin-left:auto}
.adm-card__email{font-family:'JetBrains Mono',monospace;font-size:11px;color:#7E8794;margin-bottom:8px}
.adm-card__body{font-size:13.5px;color:#C3CAD4;line-height:1.65}
.adm-card__actions{display:flex;flex-direction:column;gap:7px;min-width:108px}
.btn-approve{padding:7px 12px;background:rgba(74,222,156,.08);border:1px solid rgba(74,222,156,.25);border-radius:5px;color:#4ADE9C;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;width:100%;transition:background .15s}
.btn-approve:hover{background:rgba(74,222,156,.18)}
.btn-delete{padding:7px 12px;background:rgba(240,100,122,.06);border:1px solid rgba(240,100,122,.2);border-radius:5px;color:#F0647A;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;width:100%;transition:background .15s}
.btn-delete:hover{background:rgba(240,100,122,.14)}
.btn-unapprove{padding:7px 12px;background:rgba(232,194,104,.06);border:1px solid rgba(232,194,104,.2);border-radius:5px;color:#E8C268;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;width:100%;transition:background .15s}
.btn-unapprove:hover{background:rgba(232,194,104,.14)}
.adm-empty{text-align:center;padding:64px 24px;color:#7E8794;font-size:14px}
.adm-loader{text-align:center;padding:48px;color:#7E8794;font-size:13px}
.adm-count{font-size:12px;color:#7E8794;margin-bottom:12px}
</style>
</head>
<body>

<div id="authGate">
  <div class="ag-box">
    <div class="ag-logo">Le Terminal</div>
    <div class="ag-sub">Administration — accès restreint</div>
    <input class="ag-in" id="agPass" type="password" placeholder="Mot de passe admin" autocomplete="current-password">
    <button class="ag-btn" id="agBtn">Accéder</button>
    <div class="ag-err" id="agErr"></div>
  </div>
</div>

<div id="admin">
  <nav class="adm-nav">
    <span class="adm-nav-logo">Admin</span>
    <button class="adm-tab active" id="tabStats"    onclick="showTab('stats')">Tableau de bord</button>
    <button class="adm-tab"        id="tabPending"  onclick="showTab('pending')">Avis en attente <span id="badgePending" class="adm-badge" style="display:none"></span></button>
    <button class="adm-tab"        id="tabApproved" onclick="showTab('approved')">Avis publiés</button>
    <div class="adm-nav-live">
      <span class="adm-nav-dot" id="liveDot"></span>
      <span id="liveTxt">connexion…</span>
      <button class="adm-nav-refresh" onclick="manualRefresh()">Actualiser</button>
    </div>
  </nav>
  <div class="adm-body">
    <div id="panelStats"><div class="adm-loader">Chargement…</div></div>
    <div id="panelPending"  style="display:none"></div>
    <div id="panelApproved" style="display:none"></div>
  </div>
</div>

<script>
var ADMIN_PASS  = 'leterminal-admin-2026';
var STATS_API   = '/api/admin-stats';
var REVIEWS_API = '/api/admin-reviews';
var REFRESH_MS  = 12000;
var curTab = 'stats';
var reviewData = { pending: [], approved: [] };
var lastStats = null;
var seenEvents = {};          // signatures d'événements déjà affichés (pour "fresh")
var seenUsers = {};           // emails déjà vus (pour flash nouveaux inscrits)
var firstRender = true;
var svgCtr = 0, lastOkTs = 0, tickTimer = null;

// ── Auth ──
document.getElementById('agBtn').onclick = function(){
  var p = document.getElementById('agPass').value.trim();
  if (p !== ADMIN_PASS){ document.getElementById('agErr').textContent = 'Mot de passe incorrect.'; return; }
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('admin').style.display = 'block';
  loadStats(); loadReviews();
  startLoop();
};
document.getElementById('agPass').onkeydown = function(e){ if (e.key==='Enter') document.getElementById('agBtn').click(); };

function showTab(tab){
  curTab = tab;
  ['stats','pending','approved'].forEach(function(t){
    var T = t.charAt(0).toUpperCase()+t.slice(1);
    document.getElementById('tab'+T).className = 'adm-tab'+(t===tab?' active':'');
    document.getElementById('panel'+T).style.display = t===tab ? '' : 'none';
  });
  if (tab!=='stats' && !reviewData[tab].length) loadReviews();
}

// ── Boucle temps réel (pause si onglet caché, refresh immédiat au retour) ──
function startLoop(){
  clearInterval(tickTimer);
  tickTimer = setInterval(function(){
    updateLiveLabel();
    if (document.hidden) return;
    if (Date.now() - lastOkTs >= REFRESH_MS){ loadStats(); loadReviews(); }
  }, 1000);
}
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && document.getElementById('admin').style.display==='block'){ loadStats(); loadReviews(); }
});
function manualRefresh(){ loadStats(); loadReviews(); }
function updateLiveLabel(){
  var dot = document.getElementById('liveDot'), txt = document.getElementById('liveTxt');
  if (!dot || !lastOkTs) return;
  var s = Math.round((Date.now()-lastOkTs)/1000);
  dot.className = 'adm-nav-dot' + (s>REFRESH_MS/1000+8 ? ' stale' : '');
  txt.textContent = s<3 ? 'à jour' : 'actualisé il y a '+s+'s';
  var cd = document.getElementById('liveCountdown');
  if (cd){ var rem = Math.max(0, Math.ceil((REFRESH_MS-(Date.now()-lastOkTs))/1000)); cd.textContent = rem>0 ? 'Actualisation dans '+rem+'s' : 'Actualisation…'; }
}

// ── Helpers ──
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDur(s){ if(!s) return '—'; if(s<60) return s+'s'; return Math.floor(s/60)+'m '+(s%60)+'s'; }
function fmtDate(iso){ try{ return new Date(iso).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return ''; } }
function frDateT(iso){ try{ return new Date(iso).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function relTime(iso){
  if(!iso) return '—';
  var d = Math.floor((Date.now()-new Date(iso))/1000);
  if(d<5) return "à l'instant"; if(d<60) return 'il y a '+d+'s';
  if(d<3600) return 'il y a '+Math.floor(d/60)+'min'; return 'il y a '+Math.floor(d/3600)+'h';
}
function isMobile(ua){ return ua && /Mobile|Android|iPhone/i.test(ua); }
function deviceSvg(ua){
  return isMobile(ua)
    ? '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="2" width="14" height="20" rx="2"/><circle cx="12" cy="17.5" r=".8" fill="currentColor" stroke="none"/></svg>'
    : '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="13" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg>';
}
function stars(n){ var s=''; for(var i=0;i<5;i++) s+='<svg viewBox="0 0 24 24" width="12" height="12" style="opacity:'+(i<n?1:.18)+'"><path d="M12 2l2.95 6.18 6.8.62-5.13 4.5 1.54 6.65L12 17.1 5.84 20.45l1.54-6.65L2.25 8.8l6.8-.62z" fill="currentColor"/></svg>'; return s; }

// ── SVG charts ──
function svgLine(data,color,h){
  h=h||120; var W=600,padL=4,padR=4,padT=12,padB=22,pw=W-padL-padR,ph=h-padT-padB;
  var max=Math.max.apply(null,data.map(function(d){return d.count||0;}))||1, n=data.length;
  if(n<2) return '<div style="height:'+h+'px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px">Pas encore de données</div>';
  var pts=data.map(function(d,i){ return [padL+(i/(n-1))*pw, padT+ph-((d.count||0)/max)*ph]; });
  var path=pts.reduce(function(a,p,i){ if(i===0) return 'M'+p[0].toFixed(1)+','+p[1].toFixed(1); var pr=pts[i-1],cx=((pr[0]+p[0])/2).toFixed(1); return a+' C'+cx+','+pr[1].toFixed(1)+' '+cx+','+p[1].toFixed(1)+' '+p[0].toFixed(1)+','+p[1].toFixed(1); },'');
  var area=path+' L'+pts[n-1][0].toFixed(1)+','+(padT+ph)+' L'+pts[0][0].toFixed(1)+','+(padT+ph)+' Z';
  var grid=[0,.5,1].map(function(f){ var y=(padT+ph-f*ph).toFixed(1); return '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="rgba(255,255,255,.035)"/>'; }).join('');
  var labels=data.map(function(d,i){ if(i%2!==0) return ''; var x=pts[i][0].toFixed(1); var l=d.date?d.date.slice(5):(d.hour!==undefined?d.hour+'h':''); return '<text x="'+x+'" y="'+(h-5)+'" fill="rgba(255,255,255,.22)" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">'+l+'</text>'; }).join('');
  var dots=pts.map(function(p,i){ var d=data[i],l=d.date||(d.hour!==undefined?d.hour+'h':''); return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.6" fill="'+color+'" stroke="var(--panel)" stroke-width="1.5"><title>'+d.count+' — '+l+'</title></circle>'; }).join('');
  var gid='g'+(++svgCtr);
  return '<svg viewBox="0 0 '+W+' '+h+'" style="width:100%;display:block"><defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity=".22"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+grid+'<path d="'+area+'" fill="url(#'+gid+')"/><path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+dots+labels+'</svg>';
}
function svgHour(data){
  var W=600,H=74,barW=W/24,max=Math.max.apply(null,data.map(function(d){return d.count||0;}))||1;
  var bars=data.map(function(d,i){ var bh=Math.max((d.count/max)*52,2),x=(i*barW+1).toFixed(1),y=(60-bh).toFixed(1),op=(.3+(d.count/max)*.7).toFixed(2),c=d.count>0?'#3B7DFF':'#1C212A'; var lbl=(i%4===0)?'<text x="'+(i*barW+barW/2).toFixed(1)+'" y="70" fill="rgba(255,255,255,.22)" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">'+i+'h</text>':''; return '<rect x="'+x+'" y="'+y+'" width="'+(barW-2).toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="'+c+'" opacity="'+op+'" rx="1"><title>'+d.count+' visites à '+i+'h</title></rect>'+lbl; }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block">'+bars+'</svg>';
}

// ── Render Stats ──────────────────────────────────────
function loadStats() {
  fetch(STATS_API, { headers: { 'X-Admin-Pass': ADMIN_PASS } })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && !d.error){ lastStats=d; lastOkTs=Date.now(); renderStats(d); updateLiveLabel(); }
      else if(!lastStats){ document.getElementById('panelStats').innerHTML = '<div class="adm-empty">Erreur de chargement des statistiques.</div>'; }
    })
    .catch(function(){ if(!lastStats) document.getElementById('panelStats').innerHTML = '<div class="adm-empty">Erreur de chargement.</div>'; });
}

function renderStats(d) {
  var u  = d.users   || {};
  var t  = d.traffic || {};
  var c  = d.charts  || {};
  var co = d.content || {};
  var lv = d.live    || {};

  var now = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  var cd0 = Math.ceil(REFRESH_MS/1000);

  // Live bar
  var liveBar = '<div class="live-bar">'
    +'<span class="live-dot"></span>'
    +'<span class="live-label">Live</span>'
    +'<span class="live-sep">|</span>'
    +'<span class="live-upd" id="liveUpdated">Actualisé à '+now+'</span>'
    +'<span class="live-countdown" id="liveCountdown">Actualisation dans '+cd0+'s</span>'
    +'<button class="live-refreshbtn" onclick="manualRefresh()">Actualiser</button>'
    +'</div>';

  // KPI row 1
  var kpiRow1 = '<div class="kpi-row kpi-row--4">'
    +'<div class="kpi kpi--live"><div class="kpi__top-bar"></div>'
    +'<div class="kpi__live-badge"><span class="kpi__live-badge-dot"></span>EN DIRECT</div>'
    +'<div class="kpi__label">Actifs maintenant</div>'
    +'<div class="kpi__val">'+(t.active_now||0)+'</div>'
    +'<div class="kpi__sub">dernières 5 minutes</div></div>'
    +'<div class="kpi kpi--accent"><div class="kpi__top-bar"></div>'
    +'<div class="kpi__label">Visites aujourd\'hui</div>'
    +'<div class="kpi__val">'+(t.views_today||0)+'</div>'
    +'<div class="kpi__sub">'+(t.sessions_today||0)+' sessions uniques</div></div>'
    +'<div class="kpi kpi--bull"><div class="kpi__top-bar"></div>'
    +'<div class="kpi__label">Utilisateurs total</div>'
    +'<div class="kpi__val">'+(u.total||0)+'</div>'
    +'<div class="kpi__sub">'+(u.total ? Math.round((u.pro||0)/(u.total)*100) : 0)+'% PRO</div></div>'
    +'<div class="kpi kpi--accent"><div class="kpi__top-bar"></div>'
    +'<div class="kpi__label">Comptes PRO</div>'
    +'<div class="kpi__val">'+(u.pro||0)+'</div>'
    +'<div class="kpi__sub">'+(u.free||0)+' comptes gratuits</div></div>'
    +'</div>';

  // KPI row 2
  var kpiRow2 = '<div class="kpi-row kpi-row--4b" style="margin-bottom:20px">'
    +'<div class="kpi"><div class="kpi__top-bar"></div>'
    +'<div class="kpi__label">Visites 7 jours</div>'
    +'<div class="kpi__val" style="font-size:28px">'+(t.views_7d||0)+'</div>'
    +'<div class="kpi__sub">'+(t.sessions_7d||0)+' sessions</div></div>'
    +'<div class="kpi"><div class="kpi__top-bar"></div>'
    +'<div class="kpi__label">Visites 30 jours</div>'
    +'<div class="kpi__val" style="font-size:28px">'+(t.views_30d||0)+'</div>'
    +'<div class="kpi__sub">&nbsp;</div></div>'
    +'<div class="kpi kpi--warn"><div class="kpi__top-bar"></div>'
    +'<div class="kpi__label">Durée moy. session</div>'
    +'<div class="kpi__val" style="font-size:28px">'+fmtDur(t.avg_duration_s)+'</div>'
    +'<div class="kpi__sub">30 derniers jours</div></div>'
    +'<div class="kpi kpi--warn"><div class="kpi__top-bar"></div>'
    +'<div class="kpi__label">Avis en attente</div>'
    +'<div class="kpi__val" style="font-size:28px">'+(co.reviews_pending||0)+'</div>'
    +'<div class="kpi__sub">'+(co.reviews_published||0)+' publiés</div></div>'
    +'</div>';

  // Charts row 1: daily views + daily signups
  var chartViews   = svgLine(c.daily_views   || [], '#3B7DFF');
  var chartSignups = svgLine(c.daily_signups || [], '#4ADE9C');
  var charts1 = '<div class="charts-2">'
    +'<div class="chart-box"><div class="chart-box__title">Visites par jour — 14 jours <span>'+((c.daily_views||[]).reduce(function(a,x){return a+(x.count||0);},0))+'</span></div><div class="chart-wrap">'+chartViews+'</div></div>'
    +'<div class="chart-box"><div class="chart-box__title">Inscriptions par jour — 14 jours <span>'+((c.daily_signups||[]).reduce(function(a,x){return a+(x.count||0);},0))+'</span></div><div class="chart-wrap">'+chartSignups+'</div></div>'
    +'</div>';

  // Charts row 2: hourly peak + top pages
  var maxP=(c.top_pages&&c.top_pages[0])?(c.top_pages[0].count||1):1;
  var pagesHtml=(c.top_pages||[]).map(function(p,i){
    return '<div class="page-row"><span class="page-rank">'+(i+1)+'</span><span class="page-name">'+esc(p.page)+'</span>'
      +'<div class="page-bar-wrap"><div class="page-bar" style="width:'+Math.round((p.count||0)/maxP*100)+'%"></div></div>'
      +'<span class="page-count">'+(p.count||0)+'</span></div>';
  }).join('') || '<div style="color:var(--muted);font-size:12px;padding:14px 0">Aucune donnée pour l\'instant.</div>';
  var charts2='<div class="charts-3">'
    +'<div class="chart-box"><div class="chart-box__title">Heures de pointe — 7 jours</div><div class="chart-wrap">'+svgHour(c.hourly||[])+'</div></div>'
    +'<div class="chart-box"><div class="chart-box__title">Pages les plus visitées — 30 jours</div><div class="pages-list">'+pagesHtml+'</div></div>'
    +'</div>';

  // Live feed (connexions) — flash des nouveaux événements
  var evts=(lv.events||[]).filter(function(e){ return e.event_type==='pageview'; }).slice(0,40);
  var newSeen={};
  var feed;
  if(!evts.length){ feed='<div class="feed-empty">Aucune connexion enregistrée pour l\'instant.<br>Le tracker collecte à chaque visite du site.</div>'; }
  else {
    feed='<div class="feed-list">'+evts.map(function(e){
      var key=(e.session_id||'')+'|'+(e.created_at||'');
      var fresh=!firstRender && !seenEvents[key];
      newSeen[key]=1;
      var who=e.user_email?esc(e.user_email):'Visiteur anonyme';
      return '<div class="feed-item'+(fresh?' feed-item--new':'')+'">'
        +'<span class="feed-item__time">'+relTime(e.created_at)+'</span>'
        +'<div class="feed-item__mid"><div class="feed-item__page">'+esc(e.page||'index')+'</div>'
        +'<div class="feed-item__email">'+who+(e.session_id?' · #'+esc(e.session_id):'')+'</div></div>'
        +'<div class="feed-item__right"><span class="feed-dot feed-dot--pv"></span><span class="feed-device">'+deviceSvg(e.ua)+'</span></div></div>';
    }).join('')+'</div>';
  }
  seenEvents = newSeen;

  // Derniers inscrits
  var usersHtml=(u.recent||[]).map(function(x){
    var fresh=!firstRender && x.email && !seenUsers[x.email];
    return '<tr'+(fresh?' class="is-new"':'')+'><td class="mono">'+esc(x.email||'—')+'</td>'
      +'<td>'+(x.is_pro?'<span class="badge-pro">Premium</span>':'<span class="badge-free">Gratuit</span>')+'</td>'
      +'<td class="mono" style="color:var(--muted)">'+fmtDate(x.created_at)+'</td></tr>';
  }).join('') || '<tr><td colspan="3" style="color:var(--muted);padding:16px 8px">Aucun utilisateur</td></tr>';
  var newSeenU={}; (u.recent||[]).forEach(function(x){ if(x.email) newSeenU[x.email]=1; }); seenUsers=newSeenU;

  var bottom='<div class="charts-3">'
    +'<div class="chart-box"><div class="chart-box__title">Connexions en temps réel <span>'+evts.length+'</span></div>'+feed+'</div>'
    +'<div class="tbl-box"><div class="tbl-box__title">Derniers inscrits</div><table class="tbl"><thead><tr><th>Email</th><th>Statut</th><th>Inscription</th></tr></thead><tbody>'+usersHtml+'</tbody></table></div>'
    +'</div>';

  document.getElementById('panelStats').innerHTML = liveBar + kpiRow1 + kpiRow2 + charts1 + charts2 + bottom;
  firstRender = false;
}

// ── Reviews ──
function loadReviews(){
  fetch(REVIEWS_API+'?all=1',{ headers:{ 'X-Admin-Pass':ADMIN_PASS } })
    .then(function(r){ return r.json(); })
    .then(function(d){
      reviewData.pending  = (d.reviews||[]).filter(function(r){ return !r.approved; });
      reviewData.approved = (d.reviews||[]).filter(function(r){ return  r.approved; });
      var b=document.getElementById('badgePending');
      if(reviewData.pending.length){ b.textContent=reviewData.pending.length; b.style.display=''; } else b.style.display='none';
      renderReviews('pending'); renderReviews('approved');
    }).catch(function(){});
}
function renderReviews(tab){
  var rows=reviewData[tab], area=document.getElementById('panel'+tab.charAt(0).toUpperCase()+tab.slice(1));
  if(!area) return;
  if(!rows.length){ area.innerHTML='<div class="adm-empty">'+(tab==='pending'?'Aucun avis en attente.':'Aucun avis publié.')+'</div>'; return; }
  area.innerHTML='<div class="adm-count">'+rows.length+' avis</div><div class="adm-grid">'+rows.map(function(rv){
    return '<div class="adm-card"><div>'
      +'<div class="adm-card__meta"><span class="adm-card__name">'+esc(rv.author_name)+'</span>'
      +(rv.role?'<span class="adm-card__role">'+esc(rv.role)+'</span>':'')
      +'<span class="adm-card__stars">'+stars(rv.rating)+'</span><span class="adm-card__date">'+frDateT(rv.created_at)+'</span></div>'
      +(rv.user_email?'<div class="adm-card__email">'+esc(rv.user_email)+'</div>':'')
      +'<div class="adm-card__body">'+esc(rv.body)+'</div></div>'
      +'<div class="adm-card__actions">'
      +(tab==='pending'?'<button class="btn-approve" onclick="approveRv(\''+rv.id+'\')">Approuver</button>':'<button class="btn-unapprove" onclick="setRv(\''+rv.id+'\',false)">Retirer</button>')
      +'<button class="btn-delete" onclick="deleteRv(\''+rv.id+'\')">Supprimer</button></div></div>';
  }).join('')+'</div>';
}
function setRv(id,approved){
  fetch(REVIEWS_API,{ method:'PATCH', headers:{'Content-Type':'application/json','X-Admin-Pass':ADMIN_PASS}, body:JSON.stringify({id:id,approved:approved}) })
    .then(function(r){ return r.json(); }).then(function(d){ if(d.ok) loadReviews(); });
}
function approveRv(id){ if(confirm('Publier cet avis ?')) setRv(id,true); }
function deleteRv(id){
  if(!confirm('Supprimer définitivement cet avis ?')) return;
  fetch(REVIEWS_API,{ method:'DELETE', headers:{'Content-Type':'application/json','X-Admin-Pass':ADMIN_PASS}, body:JSON.stringify({id:id}) })
    .then(function(r){ return r.json(); }).then(function(d){ if(d.ok) loadReviews(); });
}
</script>
