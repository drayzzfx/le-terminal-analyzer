<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Terminal — Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="./fonts.css">
<style>
:root{
  --bg:#07090C; --panel:#0E1219; --panel2:#0B0E13; --line:#1B2029; --line2:#262C37;
  --txt:#C3CAD4; --title:#F2F4F7; --muted:#7E8794; --dim:#5A616C;
  --accent:#7FB8E8; --green:#4ADE9C; --red:#F0647A; --gold:#E8C268;
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
::selection{background:rgba(127,184,232,.25)}

/* ── AUTH ── */
#authGate{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(127,184,232,.06) 0%,transparent 70%)}
.ag-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:44px 36px;width:100%;max-width:380px;text-align:center}
.ag-logo{font-family:'Anton',sans-serif;font-size:26px;text-transform:uppercase;letter-spacing:.08em;color:var(--title);margin-bottom:4px}
.ag-sub{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:28px}
.ag-in{width:100%;background:#161B24;border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--title);font-family:var(--sans);font-size:14px;outline:none;margin-bottom:10px;transition:border-color .15s}
.ag-in:focus{border-color:var(--accent)}
.ag-btn{width:100%;padding:12px;background:var(--accent);border:none;border-radius:8px;color:#07090C;font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer;transition:background .15s}
.ag-btn:hover{background:#BFDCF5}
.ag-err{font-size:12px;color:var(--red);margin-top:8px;min-height:18px}

/* ── LAYOUT ── */
#admin{display:none;min-height:100vh}
.nav{background:var(--panel2);border-bottom:1px solid var(--line);padding:0 20px;display:flex;align-items:center;position:sticky;top:0;z-index:100}
.nav__logo{font-family:'Anton',sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:.1em;color:var(--title);margin-right:22px;white-space:nowrap;padding:14px 0}
.tab{padding:16px 15px;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;transition:color .15s,border-color .15s;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover:not(.active){color:var(--title)}
.tab__badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:0 5px;margin-left:6px;vertical-align:middle}
.nav__live{margin-left:auto;display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.nav__dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
.nav__dot.stale{background:var(--muted);animation:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(74,222,156,.55)}50%{box-shadow:0 0 0 5px rgba(74,222,156,0)}}
.nav__refresh{background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--muted);font-size:11px;font-family:var(--sans);padding:5px 11px;cursor:pointer;transition:border-color .15s,color .15s}
.nav__refresh:hover{border-color:var(--accent);color:var(--accent)}
.body{padding:22px 22px 90px;max-width:1440px;margin:0 auto}

/* ── KPI ── */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;margin-bottom:22px}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 17px;position:relative;overflow:hidden;transition:border-color .2s}
.kpi:hover{border-color:var(--line2)}
.kpi__bar{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent)}
.kpi--live .kpi__bar{background:linear-gradient(90deg,var(--green),transparent)}
.kpi--warn .kpi__bar{background:linear-gradient(90deg,var(--gold),transparent)}
.kpi--pro .kpi__bar{background:linear-gradient(90deg,var(--green),transparent)}
.kpi__label{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.kpi__live{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
.kpi__val{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1;color:var(--title);letter-spacing:-.01em}
.kpi--live .kpi__val{color:var(--green)}
.kpi--accent .kpi__val{color:var(--accent)}
.kpi--pro .kpi__val{color:var(--green)}
.kpi--warn .kpi__val{color:var(--gold)}
.kpi__sub{font-size:11px;color:var(--muted);margin-top:6px}
.kpi__delta{display:inline-block;margin-left:7px;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--green);opacity:0;transform:translateY(-2px);transition:opacity .3s,transform .3s}
.kpi__delta.show{opacity:1;transform:none}

/* ── PANELS ── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:11px}
.grid-32{display:grid;grid-template-columns:3fr 2fr;gap:11px;margin-bottom:11px}
@media(max-width:900px){.grid-2,.grid-32{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.card__h{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:15px;display:flex;align-items:center;justify-content:space-between}
.card__h b{font-family:var(--mono);font-size:12px;color:var(--title);font-weight:600}

/* top pages */
.pages{display:flex;flex-direction:column;gap:9px}
.prow{display:flex;align-items:center;gap:10px}
.prow__n{font-family:var(--mono);font-size:10px;color:var(--dim);width:14px;text-align:right;flex-shrink:0}
.prow__name{font-family:var(--mono);font-size:12px;color:var(--txt);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow__bar{width:78px;height:4px;background:#161B24;border-radius:99px;overflow:hidden;flex-shrink:0}
.prow__bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.prow__c{font-family:var(--mono);font-size:11px;color:var(--muted);width:30px;text-align:right;flex-shrink:0}

/* live feed */
.feed{display:flex;flex-direction:column;gap:1px;max-height:400px;overflow-y:auto}
.feed::-webkit-scrollbar{width:5px}.feed::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.fitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:7px;transition:background .15s}
.fitem:hover{background:var(--panel2)}
.fitem.fresh{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:rgba(74,222,156,.16)}100%{background:transparent}}
.fitem__t{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap;min-width:58px}
.fitem__mid{min-width:0}
.fitem__page{font-family:var(--mono);font-size:12px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem__who{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.fitem__who.auth{color:var(--accent)}
.fitem__r{display:flex;align-items:center;gap:7px;flex-shrink:0;color:var(--dim)}
.fdot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
.fempty{text-align:center;padding:44px 16px;color:var(--muted);font-size:13px;line-height:1.6}

/* users table */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:7px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--panel2);color:var(--txt);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.fresh td{animation:flashrow 1.8s ease-out}
@keyframes flashrow{0%{background:rgba(74,222,156,.12)}100%{background:transparent}}
.tbl .mono{font-family:var(--mono);font-size:11px}
.pill{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:600}
.pill--pro{background:rgba(74,222,156,.1);border:1px solid rgba(74,222,156,.28);color:var(--green)}
.pill--free{background:var(--panel2);border:1px solid var(--line);color:var(--muted)}

/* reviews */
.rev-count{font-size:12px;color:var(--muted);margin-bottom:13px}
.rev-grid{display:flex;flex-direction:column;gap:11px}
.rev{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;transition:border-color .15s}
.rev:hover{border-color:var(--line2)}
.rev__meta{display:flex;align-items:center;gap:10px;margin-bottom:7px;flex-wrap:wrap}
.rev__name{font-weight:600;font-size:14px;color:var(--title)}
.rev__role{font-size:11px;color:var(--muted);background:#161B24;padding:2px 8px;border-radius:5px}
.rev__stars{display:flex;gap:2px;color:var(--gold)}
.rev__date{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto}
.rev__email{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:8px}
.rev__body{font-size:13.5px;color:var(--txt);line-height:1.65}
.rev__act{display:flex;flex-direction:column;gap:8px;min-width:114px}
.b{padding:8px 12px;border-radius:6px;font-family:var(--sans);font-size:12px;font-weight:600;cursor:pointer;width:100%;transition:background .15s;border:1px solid transparent}
.b--ok{background:rgba(74,222,156,.09);border-color:rgba(74,222,156,.28);color:var(--green)}.b--ok:hover{background:rgba(74,222,156,.2)}
.b--warn{background:rgba(232,194,104,.07);border-color:rgba(232,194,104,.22);color:var(--gold)}.b--warn:hover{background:rgba(232,194,104,.16)}
.b--del{background:rgba(240,100,122,.06);border-color:rgba(240,100,122,.22);color:var(--red)}.b--del:hover{background:rgba(240,100,122,.15)}
.empty{text-align:center;padding:64px 24px;color:var(--muted);font-size:14px}
.loader{text-align:center;padding:52px;color:var(--muted);font-size:13px}
</style>
</head>
<body>

<div id="authGate">
  <div class="ag-box">
    <div class="ag-logo">Le Terminal</div>
    <div class="ag-sub">Administration — accès restreint</div>
    <input class="ag-in" id="agPass" type="password" placeholder="Mot de passe admin" autocomplete="current-password">
    <button class="ag-btn" id="agBtn">Accéder</button>
    <div class="ag-err" id="agErr"></div>
  </div>
</div>

<div id="admin">
  <nav class="nav">
    <span class="nav__logo">Admin</span>
    <button class="tab active" id="tabStats"    onclick="showTab('stats')">Tableau de bord</button>
    <button class="tab"        id="tabPending"  onclick="showTab('pending')">Avis en attente <span id="badgePending" class="tab__badge" style="display:none"></span></button>
    <button class="tab"        id="tabApproved" onclick="showTab('approved')">Avis publiés</button>
    <div class="nav__live">
      <span class="nav__dot" id="liveDot"></span>
      <span id="liveTxt">connexion…</span>
      <button class="nav__refresh" onclick="manualRefresh()">Actualiser</button>
    </div>
  </nav>
  <div class="body">
    <div id="panelStats"></div>
    <div id="panelPending"  style="display:none"></div>
    <div id="panelApproved" style="display:none"></div>
  </div>
</div>

<script>
var ADMIN_PASS  = 'leterminal-admin-2026';
var STATS_API   = '/api/admin-stats';
var REVIEWS_API = '/api/admin-reviews';
var REFRESH_MS  = 12000;
var curTab = 'stats';
var reviewData = { pending: [], approved: [] };
var lastStats = null, prevTotal = null, prevActive = null;
var seenEvents = {};          // signatures d'événements déjà affichés (pour "fresh")
var seenUsers = {};           // emails déjà vus (pour flash nouveaux inscrits)
var firstRender = true;
var svgCtr = 0, lastOkTs = 0, tickTimer = null;

// ── Auth ──
document.getElementById('agBtn').onclick = function(){
  var p = document.getElementById('agPass').value.trim();
  if (p !== ADMIN_PASS){ document.getElementById('agErr').textContent = 'Mot de passe incorrect.'; return; }
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('admin').style.display = 'block';
  loadStats(); loadReviews();
  startLoop();
};
document.getElementById('agPass').onkeydown = function(e){ if (e.key==='Enter') document.getElementById('agBtn').click(); };

function showTab(tab){
  curTab = tab;
  ['stats','pending','approved'].forEach(function(t){
    var T = t.charAt(0).toUpperCase()+t.slice(1);
    document.getElementById('tab'+T).className = 'tab'+(t===tab?' active':'');
    document.getElementById('panel'+T).style.display = t===tab ? '' : 'none';
  });
}

// ── Boucle temps réel (pause si onglet caché, refresh immédiat au retour) ──
function startLoop(){
  clearInterval(tickTimer);
  tickTimer = setInterval(function(){
    updateLiveLabel();
    if (document.hidden) return;
    if (Date.now() - lastOkTs >= REFRESH_MS){ loadStats(); if (curTab!=='stats') loadReviews(); }
  }, 1000);
}
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && document.getElementById('admin').style.display==='block'){ loadStats(); loadReviews(); }
});
function manualRefresh(){ loadStats(); loadReviews(); }
function updateLiveLabel(){
  var dot = document.getElementById('liveDot'), txt = document.getElementById('liveTxt');
  if (!dot || !lastOkTs) return;
  var s = Math.round((Date.now()-lastOkTs)/1000);
  dot.className = 'nav__dot' + (s>REFRESH_MS/1000+8 ? ' stale' : '');
  txt.textContent = s<3 ? 'à jour' : 'actualisé il y a '+s+'s';
}

// ── Helpers ──
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDur(s){ if(!s) return '—'; if(s<60) return s+'s'; return Math.floor(s/60)+'m '+(s%60)+'s'; }
function fmtDate(iso){ try{ return new Date(iso).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return ''; } }
function frDateT(iso){ try{ return new Date(iso).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function relTime(iso){
  if(!iso) return '—';
  var d = Math.floor((Date.now()-new Date(iso))/1000);
  if(d<5) return "à l'instant"; if(d<60) return 'il y a '+d+'s';
  if(d<3600) return 'il y a '+Math.floor(d/60)+'min'; return 'il y a '+Math.floor(d/3600)+'h';
}
function isMobile(ua){ return ua && /Mobile|Android|iPhone/i.test(ua); }
function deviceSvg(ua){
  return isMobile(ua)
    ? '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="2" width="14" height="20" rx="2"/><circle cx="12" cy="17.5" r=".8" fill="currentColor" stroke="none"/></svg>'
    : '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="13" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg>';
}
function stars(n){ var s=''; for(var i=0;i<5;i++) s+='<svg viewBox="0 0 24 24" width="12" height="12" style="opacity:'+(i<n?1:.18)+'"><path d="M12 2l2.95 6.18 6.8.62-5.13 4.5 1.54 6.65L12 17.1 5.84 20.45l1.54-6.65L2.25 8.8l6.8-.62z" fill="currentColor"/></svg>'; return s; }

// ── SVG charts ──
function svgLine(data,color,h){
  h=h||120; var W=600,padL=4,padR=4,padT=12,padB=22,pw=W-padL-padR,ph=h-padT-padB;
  var max=Math.max.apply(null,data.map(function(d){return d.count||0;}))||1, n=data.length;
  if(n<2) return '<div style="height:'+h+'px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px">Pas encore de données</div>';
  var pts=data.map(function(d,i){ return [padL+(i/(n-1))*pw, padT+ph-((d.count||0)/max)*ph]; });
  var path=pts.reduce(function(a,p,i){ if(i===0) return 'M'+p[0].toFixed(1)+','+p[1].toFixed(1); var pr=pts[i-1],cx=((pr[0]+p[0])/2).toFixed(1); return a+' C'+cx+','+pr[1].toFixed(1)+' '+cx+','+p[1].toFixed(1)+' '+p[0].toFixed(1)+','+p[1].toFixed(1); },'');
  var area=path+' L'+pts[n-1][0].toFixed(1)+','+(padT+ph)+' L'+pts[0][0].toFixed(1)+','+(padT+ph)+' Z';
  var grid=[0,.5,1].map(function(f){ var y=(padT+ph-f*ph).toFixed(1); return '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="rgba(255,255,255,.035)"/>'; }).join('');
  var labels=data.map(function(d,i){ if(i%2!==0) return ''; var x=pts[i][0].toFixed(1); var l=d.date?d.date.slice(5):(d.hour!==undefined?d.hour+'h':''); return '<text x="'+x+'" y="'+(h-5)+'" fill="rgba(255,255,255,.22)" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">'+l+'</text>'; }).join('');
  var dots=pts.map(function(p,i){ var d=data[i],l=d.date||(d.hour!==undefined?d.hour+'h':''); return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.6" fill="'+color+'" stroke="var(--panel)" stroke-width="1.5"><title>'+d.count+' — '+l+'</title></circle>'; }).join('');
  var gid='g'+(++svgCtr);
  return '<svg viewBox="0 0 '+W+' '+h+'" style="width:100%;display:block"><defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity=".22"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+grid+'<path d="'+area+'" fill="url(#'+gid+')"/><path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+dots+labels+'</svg>';
}
function svgHour(data){
  var W=600,H=74,barW=W/24,max=Math.max.apply(null,data.map(function(d){return d.count||0;}))||1;
  var bars=data.map(function(d,i){ var bh=Math.max((d.count/max)*52,2),x=(i*barW+1).toFixed(1),y=(60-bh).toFixed(1),op=(.3+(d.count/max)*.7).toFixed(2),c=d.count>0?'#7FB8E8':'#1C212A'; var lbl=(i%4===0)?'<text x="'+(i*barW+barW/2).toFixed(1)+'" y="70" fill="rgba(255,255,255,.22)" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">'+i+'h</text>':''; return '<rect x="'+x+'" y="'+y+'" width="'+(barW-2).toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="'+c+'" opacity="'+op+'" rx="1"><title>'+d.count+' visites à '+i+'h</title></rect>'+lbl; }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block">'+bars+'</svg>';
}

// ── Stats ──
function loadStats(){
  if (firstRender) document.getElementById('panelStats').innerHTML = '<div class="loader">Chargement…</div>';
  fetch(STATS_API,{ headers:{ 'X-Admin-Pass':ADMIN_PASS } })
    .then(function(r){ return r.json(); })
    .then(function(d){ if(d && !d.error){ lastStats=d; lastOkTs=Date.now(); renderStats(d); updateLiveLabel(); } })
    .catch(function(){ if(!lastStats) document.getElementById('panelStats').innerHTML = '<div class="empty">Erreur de chargement.</div>'; });
}

function kpi(cls,label,val,sub,live,delta){
  return '<div class="kpi '+cls+'"><div class="kpi__bar"></div>'
    +'<div class="kpi__label">'+(live?'<span class="kpi__live"></span>':'')+label+'</div>'
    +'<div class="kpi__val">'+val+(delta!=null?'<span class="kpi__delta show">+'+delta+'</span>':'')+'</div>'
    +'<div class="kpi__sub">'+sub+'</div></div>';
}

function renderStats(d){
  var u=d.users||{}, t=d.traffic||{}, c=d.charts||{}, co=d.content||{}, lv=d.live||{};

  var dUsers  = (prevTotal!=null && u.total>prevTotal) ? (u.total-prevTotal) : null;
  var dActive = (prevActive!=null && t.active_now>prevActive) ? (t.active_now-prevActive) : null;
  prevTotal = u.total; prevActive = t.active_now;

  var kpis = '<div class="kpis">'
    + kpi('kpi--live','Actifs maintenant',(t.active_now||0),'5 dernières minutes',true,dActive)
    + kpi('kpi--accent','Visites aujourd\'hui',(t.views_today||0),(t.sessions_today||0)+' sessions',false,null)
    + kpi('kpi--pro','Nouveaux comptes 24h',(u.new_24h||0),'inscriptions',false,null)
    + kpi('','Utilisateurs',(u.total||0),(u.total?Math.round((u.pro||0)/u.total*100):0)+'% Premium',false,dUsers)
    + kpi('kpi--pro','Comptes Premium',(u.pro||0),(u.free||0)+' gratuits',false,null)
    + kpi('kpi--warn','Avis en attente',(co.reviews_pending||0),(co.reviews_published||0)+' publiés',false,null)
    + '</div>';

  var totV=(c.daily_views||[]).reduce(function(a,x){return a+x.count;},0);
  var totS=(c.daily_signups||[]).reduce(function(a,x){return a+x.count;},0);
  var charts1='<div class="grid-2">'
    +'<div class="card"><div class="card__h">Visites par jour — 14 j <b>'+totV+'</b></div>'+svgLine(c.daily_views||[],'#7FB8E8')+'</div>'
    +'<div class="card"><div class="card__h">Inscriptions par jour — 14 j <b>'+totS+'</b></div>'+svgLine(c.daily_signups||[],'#4ADE9C')+'</div>'
    +'</div>';

  var maxP=(c.top_pages&&c.top_pages[0])?c.top_pages[0].count:1;
  var pagesHtml=(c.top_pages||[]).map(function(p,i){ return '<div class="prow"><span class="prow__n">'+(i+1)+'</span><span class="prow__name">'+esc(p.page)+'</span><div class="prow__bar"><i style="width:'+Math.round(p.count/maxP*100)+'%"></i></div><span class="prow__c">'+p.count+'</span></div>'; }).join('') || '<div style="color:var(--muted);font-size:12px;padding:14px 0">Aucune donnée pour l\'instant.</div>';
  var charts2='<div class="grid-2">'
    +'<div class="card"><div class="card__h">Heures de pointe — 7 j</div>'+svgHour(c.hourly||[])+'</div>'
    +'<div class="card"><div class="card__h">Pages les plus visitées — 30 j</div><div class="pages">'+pagesHtml+'</div></div>'
    +'</div>';

  // Live feed (connexions) — flash des événements nouveaux depuis le dernier refresh
  var evts=(lv.events||[]).filter(function(e){ return e.event_type==='pageview'; }).slice(0,40);
  var newSeen={};
  var feed;
  if(!evts.length){ feed='<div class="fempty">Aucune connexion enregistrée pour l\'instant.<br>Le tracker collecte à chaque visite du site.</div>'; }
  else {
    feed=evts.map(function(e){
      var key=(e.session_id||'')+'|'+(e.created_at||'');
      var fresh=!firstRender && !seenEvents[key];
      newSeen[key]=1;
      var who=e.user_email?esc(e.user_email):'Visiteur anonyme';
      return '<div class="fitem'+(fresh?' fresh':'')+'">'
        +'<span class="fitem__t">'+relTime(e.created_at)+'</span>'
        +'<div class="fitem__mid"><div class="fitem__page">'+esc(e.page||'index')+'</div>'
        +'<div class="fitem__who'+(e.user_email?' auth':'')+'">'+who+(e.session_id?' · #'+esc(e.session_id):'')+'</div></div>'
        +'<div class="fitem__r"><span class="fdot"></span>'+deviceSvg(e.ua)+'</div></div>';
    }).join('');
  }
  seenEvents = newSeen;

  var usersHtml=(u.recent||[]).map(function(x){
    var fresh=!firstRender && x.email && !seenUsers[x.email];
    return '<tr'+(fresh?' class="fresh"':'')+'><td class="mono">'+esc(x.email||'—')+'</td>'
      +'<td>'+(x.is_pro?'<span class="pill pill--pro">Premium</span>':'<span class="pill pill--free">Gratuit</span>')+'</td>'
      +'<td class="mono" style="color:var(--muted)">'+fmtDate(x.created_at)+'</td></tr>';
  }).join('') || '<tr><td colspan="3" style="color:var(--muted);padding:16px 8px">Aucun utilisateur</td></tr>';
  var newSeenU={}; (u.recent||[]).forEach(function(x){ if(x.email) newSeenU[x.email]=1; }); seenUsers=newSeenU;

  var bottom='<div class="grid-32">'
    +'<div class="card"><div class="card__h">Connexions en temps réel <b>'+evts.length+'</b></div><div class="feed">'+feed+'</div></div>'
    +'<div class="card"><div class="card__h">Derniers inscrits</div><table class="tbl"><thead><tr><th>Email</th><th>Statut</th><th>Inscription</th></tr></thead><tbody>'+usersHtml+'</tbody></table></div>'
    +'</div>';

  document.getElementById('panelStats').innerHTML = kpis + charts1 + charts2 + bottom;
  firstRender = false;
}

// ── Reviews ──
function loadReviews(){
  fetch(REVIEWS_API+'?all=1',{ headers:{ 'X-Admin-Pass':ADMIN_PASS } })
    .then(function(r){ return r.json(); })
    .then(function(d){
      reviewData.pending  = (d.reviews||[]).filter(function(r){ return !r.approved; });
      reviewData.approved = (d.reviews||[]).filter(function(r){ return  r.approved; });
      var b=document.getElementById('badgePending');
      if(reviewData.pending.length){ b.textContent=reviewData.pending.length; b.style.display=''; } else b.style.display='none';
      renderReviews('pending'); renderReviews('approved');
    }).catch(function(){});
}
function renderReviews(tab){
  var rows=reviewData[tab], area=document.getElementById('panel'+tab.charAt(0).toUpperCase()+tab.slice(1));
  if(!rows.length){ area.innerHTML='<div class="empty">'+(tab==='pending'?'Aucun avis en attente.':'Aucun avis publié.')+'</div>'; return; }
  area.innerHTML='<div class="rev-count">'+rows.length+' avis</div><div class="rev-grid">'+rows.map(function(rv){
    return '<div class="rev"><div>'
      +'<div class="rev__meta"><span class="rev__name">'+esc(rv.author_name)+'</span>'
      +(rv.role?'<span class="rev__role">'+esc(rv.role)+'</span>':'')
      +'<span class="rev__stars">'+stars(rv.rating)+'</span><span class="rev__date">'+frDateT(rv.created_at)+'</span></div>'
      +(rv.user_email?'<div class="rev__email">'+esc(rv.user_email)+'</div>':'')
      +'<div class="rev__body">'+esc(rv.body)+'</div></div>'
      +'<div class="rev__act">'
      +(tab==='pending'?'<button class="b b--ok" onclick="approveRv(\''+rv.id+'\')">Approuver</button>':'<button class="b b--warn" onclick="setRv(\''+rv.id+'\',false)">Retirer</button>')
      +'<button class="b b--del" onclick="deleteRv(\''+rv.id+'\')">Supprimer</button></div></div>';
  }).join('')+'</div>';
}
function setRv(id,approved){
  fetch(REVIEWS_API,{ method:'PATCH', headers:{'Content-Type':'application/json','X-Admin-Pass':ADMIN_PASS}, body:JSON.stringify({id:id,approved:approved}) })
    .then(function(r){ return r.json(); }).then(function(d){ if(d.ok) loadReviews(); });
}
function approveRv(id){ if(confirm('Publier cet avis ?')) setRv(id,true); }
function deleteRv(id){
  if(!confirm('Supprimer définitivement cet avis ?')) return;
  fetch(REVIEWS_API,{ method:'DELETE', headers:{'Content-Type':'application/json','X-Admin-Pass':ADMIN_PASS}, body:JSON.stringify({id:id}) })
    .then(function(r){ return r.json(); }).then(function(d){ if(d.ok) loadReviews(); });
}
</script>
